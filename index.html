<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<style>body{margin:0}</style>
<title>Caixa MEI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: caderneta de caixa. Cabeçalho com ano/mês, abas (rodapé no celular, topo no desktop), cartões de apuração e lista de lançamentos. */
:root {
  --bg:#EDF1F0; --surface:#FFFFFF; --surface2:#F4F7F6; --ink:#101C1A; --ink2:#4A5B58; --line:#D5DDDB;
  --accent:#2146C7; --accent-ink:#FFFFFF; --accent-bg:#E4EAFB;
  --pos:#0F7B4F; --pos-bg:#E1F2E9; --neg:#B42318; --neg-bg:#FBE7E4; --warn:#9A6200; --warn-bg:#FBF0D9;
  --com:#B4540A; --pat:#0E7490;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Instrument Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(16,28,26,.06),0 6px 18px rgba(16,28,26,.06);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#0B1312; --surface:#131D1B; --surface2:#192624; --ink:#E6EEEC; --ink2:#9DB0AC; --line:#263633;
  --accent:#8FA8FF; --accent-ink:#0B1312; --accent-bg:#1B2748;
  --pos:#4FD39A; --pos-bg:#12332A; --neg:#FF8A7A; --neg-bg:#3A1C18; --warn:#E8B64F; --warn-bg:#35290F;
  --com:#F0A15C; --pat:#5CCBE6; --shadow:none; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg:#0B1312; --surface:#131D1B; --surface2:#192624; --ink:#E6EEEC; --ink2:#9DB0AC; --line:#263633;
  --accent:#8FA8FF; --accent-ink:#0B1312; --accent-bg:#1B2748;
  --pos:#4FD39A; --pos-bg:#12332A; --neg:#FF8A7A; --neg-bg:#3A1C18; --warn:#E8B64F; --warn-bg:#35290F;
  --com:#F0A15C; --pat:#5CCBE6; --shadow:none; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display:none !important; }
body { background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.45; padding-inline:16px; padding-block:0 96px; }
h1,h2,h3 { font-family:var(--f-display); font-weight:700; margin:0; text-wrap:balance; letter-spacing:-.01em; }
h2 { font-size:1.15rem; } h3 { font-size:1rem; }
p { margin:0; }
button,input,select,textarea { font:inherit; color:inherit; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.num { font-family:var(--f-mono); font-variant-numeric:tabular-nums; }
.wrap { max-width:980px; margin-inline:auto; }
.muted { color:var(--ink2); }
.small { font-size:.82rem; }
.eyebrow { font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:var(--ink2); font-weight:600; }
.pos { color:var(--pos); } .neg { color:var(--neg); } .warnc { color:var(--warn); }

header.top { position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bg); padding-block:12px 10px; border-bottom:1px solid var(--line); }
.top .wrap { display:flex; gap:10px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
.brand { display:flex; flex-direction:column; min-width:0; }
.brand b { font-family:var(--f-display); font-size:1.2rem; }
.brand span { font-size:.78rem; color:var(--ink2); }
.pick { display:flex; gap:6px; align-items:center; }
.pick select, .pick button { background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:7px 10px; min-height:36px; }
.pick button { cursor:pointer; }

nav.tabs { position:fixed; left:0; right:0; bottom:0; z-index:6; background:var(--surface); border-top:1px solid var(--line); display:flex; padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px)); gap:2px; }
nav.tabs button { flex:1; background:none; border:0; padding:8px 2px; border-radius:8px; color:var(--ink2); font-size:.74rem; font-weight:600; cursor:pointer; min-width:0; }
nav.tabs button[aria-current="page"] { color:var(--accent); background:var(--accent-bg); }
@media (min-width: 760px) {
  nav.tabs { position:static; border:0; background:none; max-width:980px; margin:10px auto 0; padding:0; gap:6px; }
  nav.tabs button { flex:none; padding:8px 16px; font-size:.9rem; }
  body { padding-block:0 60px; }
}
main { max-width:980px; margin-inline:auto; padding-block:16px; display:grid; gap:14px; }
.grid2 { display:grid; gap:14px; grid-template-columns:1fr; }
.grid3 { display:grid; gap:10px; grid-template-columns:1fr 1fr; }
@media (min-width: 760px) { .grid2 { grid-template-columns:1fr 1fr; } .grid3 { grid-template-columns:repeat(4,1fr); } }
.card { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px; min-width:0; }
.card.flat { background:var(--surface2); }
.card.hi { box-shadow:var(--shadow); }
.card > h2, .card > h3 { margin-bottom:10px; }
.kpi { display:flex; flex-direction:column; gap:2px; min-width:0; }
.kpi .v { font-family:var(--f-mono); font-size:1.25rem; font-weight:500; overflow-wrap:anywhere; }
.kpi .s { font-size:.78rem; color:var(--ink2); }
.hero .v { font-size:1.9rem; }

.pill { display:inline-block; font-size:.72rem; font-weight:600; padding:2px 8px; border-radius:99px; background:var(--surface2); border:1px solid var(--line); color:var(--ink2); white-space:nowrap; }
.pill.ok { background:var(--pos-bg); color:var(--pos); border-color:transparent; }
.pill.bad { background:var(--neg-bg); color:var(--neg); border-color:transparent; }
.pill.warn { background:var(--warn-bg); color:var(--warn); border-color:transparent; }
.pill.info { background:var(--accent-bg); color:var(--accent); border-color:transparent; }
.dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; }

.gauge { height:12px; border-radius:99px; background:var(--surface2); border:1px solid var(--line); position:relative; overflow:hidden; }
.gauge i { position:absolute; inset:0 auto 0 0; background:var(--accent); border-radius:99px; }
.gauge i.warn { background:var(--warn); } .gauge i.bad { background:var(--neg); }
.gauge u { position:absolute; top:-1px; bottom:-1px; width:2px; background:var(--ink); opacity:.5; }

.list { display:grid; }
.tx { display:grid; grid-template-columns:auto 1fr auto; gap:4px 10px; align-items:center; padding:10px 0; border-top:1px solid var(--line); }
.tx:first-child { border-top:0; }
.tx .d { font-family:var(--f-mono); font-size:.78rem; color:var(--ink2); }
.tx .t { min-width:0; overflow-wrap:anywhere; }
.tx .t b { font-weight:600; }
.tx .a { font-family:var(--f-mono); font-weight:500; text-align:right; }
.tx .x { grid-column:2 / 4; display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
.link { background:none; border:0; padding:2px 4px; color:var(--accent); cursor:pointer; font-size:.82rem; text-decoration:underline; }
.link.danger { color:var(--neg); }

.tbl { width:100%; border-collapse:collapse; font-size:.9rem; }
.tbl th,.tbl td { text-align:left; padding:7px 6px; border-top:1px solid var(--line); }
.tbl th { font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--ink2); border-top:0; }
.tbl td.r, .tbl th.r { text-align:right; font-family:var(--f-mono); font-variant-numeric:tabular-nums; }
.tbl tr.sum td { font-weight:600; border-top:2px solid var(--ink); }
.scroll { overflow-x:auto; }

.btn { background:var(--accent); color:var(--accent-ink); border:0; border-radius:9px; padding:10px 16px; min-height:42px; font-weight:600; cursor:pointer; }
.btn.alt { background:var(--surface); color:var(--ink); border:1px solid var(--line); }
.btn.sm { padding:6px 12px; min-height:34px; font-size:.86rem; }
.btn[disabled] { opacity:.5; cursor:not-allowed; }
.fab { position:fixed; right:16px; bottom:calc(72px + env(safe-area-inset-bottom,0px)); z-index:7; border-radius:99px; padding:12px 20px; box-shadow:0 6px 18px rgba(0,0,0,.25); }
@media (min-width: 760px) { .fab { bottom:24px; } }

.banner { background:var(--warn-bg); color:var(--ink); border:1px solid var(--line); border-radius:12px; padding:12px 14px; display:flex; gap:10px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
.alerts { display:grid; gap:8px; }
.alert { border-radius:10px; padding:10px 12px; font-size:.9rem; border:1px solid var(--line); background:var(--surface); }
.alert.bad { background:var(--neg-bg); border-color:transparent; }
.alert.warn { background:var(--warn-bg); border-color:transparent; }
.alert.ok { background:var(--pos-bg); border-color:transparent; }

.sheetbg { position:fixed; inset:0; background:rgba(8,14,13,.55); z-index:20; display:flex; align-items:flex-end; justify-content:center; }
.sheet { background:var(--surface); width:100%; max-width:560px; max-height:92%; overflow:auto; border-radius:16px 16px 0 0; padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px)); display:grid; gap:12px; }
@media (min-width: 760px) { .sheetbg { align-items:center; } .sheet { border-radius:16px; } }
.seg { display:flex; flex-wrap:wrap; gap:6px; }
.seg label { flex:1 1 auto; }
.seg input { position:absolute; opacity:0; pointer-events:none; }
.seg span { display:block; text-align:center; padding:8px 10px; border:1px solid var(--line); border-radius:9px; background:var(--surface2); cursor:pointer; font-size:.88rem; font-weight:500; }
.seg input:checked + span { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
.seg input:focus-visible + span { outline:2px solid var(--accent); outline-offset:2px; }
.field { display:grid; gap:4px; min-width:0; }
.field label, .field .l { font-size:.78rem; font-weight:600; color:var(--ink2); }
.field input, .field select, .field textarea { background:var(--surface2); border:1px solid var(--line); border-radius:9px; padding:10px; min-height:42px; width:100%; min-width:0; }
.frow { display:grid; gap:10px; grid-template-columns:1fr 1fr; }
.check { display:flex; gap:8px; align-items:center; font-size:.92rem; }
.check input { width:20px; height:20px; }
.toast { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(130px + env(safe-area-inset-bottom,0px)); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:99px; z-index:30; font-size:.9rem; max-width:90%; }
.steps { display:grid; gap:0; }
.step { display:flex; justify-content:space-between; gap:12px; padding:9px 0; border-top:1px solid var(--line); align-items:baseline; }
.step:first-child { border-top:0; }
.step.total { border-top:2px solid var(--ink); font-weight:600; }
.step .n { font-family:var(--f-mono); font-variant-numeric:tabular-nums; white-space:nowrap; }
.chart { width:100%; height:auto; display:block; }
.chart text { fill:var(--ink2); font-family:var(--f-mono); font-size:10px; }
.legend { display:flex; gap:14px; flex-wrap:wrap; font-size:.8rem; color:var(--ink2); margin-top:6px; }
.months { display:grid; grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:8px; }
.mcell { background:var(--surface2); border:1px solid var(--line); border-radius:10px; padding:8px; display:grid; gap:4px; font-size:.78rem; }
.mcell b { font-size:.82rem; }
details summary { cursor:pointer; font-weight:600; }
@media (prefers-reduced-motion: no-preference) { .gauge i { transition: width .4s ease; } }
</style>
</head>
<body>
<header class="top" id="hdr"></header>
<nav class="tabs" id="nav" aria-label="Seções"></nav>
<main id="view"></main>
<button class="btn fab" id="fab" data-act="novo" data-tipo="receita">+ Lançar</button>
<div class="sheetbg" id="sheetbg" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="config.js"></script>
<script>
/* ===== Cálculos (puros, regime de caixa) ===== */
const DEFAULT_CFG = {
  nome: 'Meu MEI',
  das: 86.05,            // DAS serviços 2026 (INSS 81,05 + ISS 5,00)
  limite: 81000,
  presuncao: 32,         // % de presunção de lucro isento para serviços
  descontaDas: true,     // abate o DAS pago do teto isento (leitura conservadora)
  pctIsento: 32,         // % do faturamento que você transfere como lucro isento
  reservaCaixa: 10,      // % do lucro tributável que fica na empresa
  saldoCC0: 0,           // saldo da conta corrente antes do primeiro lançamento
  saldoInv0: 0,          // saldo das aplicações antes do primeiro lançamento
  lucroInicial: 0,       // lucro já guardado na empresa antes de começar a usar o app
  retiradaAlvo: 0,       // quanto você quer receber por mês (0 = desligado)
  caixaMin: 2000,        // colchão mínimo que fica na conta corrente
  reservaIR: 0,                  // % estimada para separar para o IRPF do tributável
  abertura: '',          // AAAA-MM, só preencher se abriu o MEI no ano corrente
  fontes: [
    { id: 'com', nome: 'Comunicação e Marketing', cor: 'var(--com)' },
    { id: 'pat', nome: 'Aulas de Patinação', cor: 'var(--pat)' }
  ]
};
const CATS = ['DAS MEI','Anúncios e tráfego pago','Software e assinaturas','Equipamentos','Pista, gelo e aluguel de espaço','Figurinos e material','Transporte','Internet e telefone','Contador e serviços','Tarifas bancárias','Cursos e capacitação','Outras despesas'];
const TIPOS = {
  receita:   { nome: 'Receita',            cc: +1, inv: 0 },
  despesa:   { nome: 'Despesa',            cc: -1, inv: 0 },
  aplicacao: { nome: 'Aplicação',          cc: -1, inv: +1 },
  resgate:   { nome: 'Resgate',            cc: +1, inv: -1 },
  rendimento:{ nome: 'Rendimento líquido', cc: 0,  inv: +1 },
  ret_isenta:{ nome: 'Lucro isento',       cc: -1, inv: 0 },
  ret_trib:  { nome: 'Lucro tributável',   cc: -1, inv: 0 },
  aporte:    { nome: 'Aporte do titular',  cc: +1, inv: 0 }
};
const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const ymOf = d => String(d).slice(0, 7);
const yOf = d => Number(String(d).slice(0, 4));

function sumTx(txs, f) { let s = 0; for (const t of txs) if (f(t)) s += Number(t.valor) || 0; return r2(s); }

function balances(txs, cfg) {
  let cc = cfg ? Number(cfg.saldoCC0) || 0 : 0, inv = cfg ? Number(cfg.saldoInv0) || 0 : 0;
  for (const t of txs) { const k = TIPOS[t.tipo]; if (!k) continue; const v = Number(t.valor) || 0; cc += k.cc * v; inv += k.inv * v; }
  return { cc: r2(cc), inv: r2(inv) };
}

// Totais de um conjunto de lançamentos já filtrado por período
function totals(txs) {
  const t = { receita: 0, porFonte: {}, desp: 0, das: 0, rend: 0, retIsenta: 0, retTrib: 0, aplic: 0, resg: 0, aporte: 0, comNF: 0, semNF: 0 };
  for (const x of txs) {
    const v = Number(x.valor) || 0;
    if (x.tipo === 'receita') { t.receita += v; t.porFonte[x.fonte] = (t.porFonte[x.fonte] || 0) + v; if (x.nf) t.comNF += v; else t.semNF += v; }
    else if (x.tipo === 'despesa') { if (x.cat === 'DAS MEI') t.das += v; else t.desp += v; }
    else if (x.tipo === 'rendimento') t.rend += v;
    else if (x.tipo === 'ret_isenta') t.retIsenta += v;
    else if (x.tipo === 'ret_trib') t.retTrib += v;
    else if (x.tipo === 'aplicacao') t.aplic += v;
    else if (x.tipo === 'resgate') t.resg += v;
    else if (x.tipo === 'aporte') t.aporte += v;
  }
  for (const k in t) if (typeof t[k] === 'number') t[k] = r2(t[k]);
  for (const k in t.porFonte) t.porFonte[k] = r2(t.porFonte[k]);
  t.resultado = r2(t.receita - t.desp - t.das + t.rend);
  t.retiradas = r2(t.retIsenta + t.retTrib);
  return t;
}
const monthTx = (txs, ym) => txs.filter(t => ymOf(t.data) === ym);
// Do mês 01 até o mês informado (inclusive) / só meses anteriores
const ytdTx = (txs, ym) => txs.filter(t => yOf(t.data) === yOf(ym) && ymOf(t.data) <= ym);
const beforeTx = (txs, ym) => txs.filter(t => yOf(t.data) === yOf(ym) && ymOf(t.data) < ym);

// Limite de faturamento (só receitas de atividade; rendimento financeiro não entra)
function limiteMei(txs, ano, cfg, hoje) {
  const rec = totals(txs.filter(t => yOf(t.data) === ano)).receita;
  let meses = 12;
  if (cfg.abertura && Number(cfg.abertura.slice(0, 4)) === ano) meses = 12 - Number(cfg.abertura.slice(5, 7)) + 1;
  const lim = r2(cfg.limite / 12 * meses);
  const hojeAno = Number(String(hoje).slice(0, 4));
  let decorridos = 12;
  if (ano === hojeAno) decorridos = Number(String(hoje).slice(5, 7));
  if (ano > hojeAno) decorridos = 1;
  const ini = cfg.abertura && Number(cfg.abertura.slice(0, 4)) === ano ? Number(cfg.abertura.slice(5, 7)) : 1;
  const ativos = Math.max(1, decorridos - ini + 1);
  const projecao = r2(rec / ativos * meses);
  const pct = lim ? rec / lim : 0;
  const tol = r2(lim * 1.2);
  let nivel = 'ok';
  if (rec > tol) nivel = 'critico'; else if (rec > lim) nivel = 'excesso'; else if (pct >= 0.8) nivel = 'atencao';
  return { receita: rec, limite: lim, tolerancia: tol, folga: r2(lim - rec), pct, projecao, nivel, meses, mediaMes: r2(rec / ativos) };
}

// Apuração do mês e sugestão de retirada
function apuracao(txs, ym, cfg) {
  const mes = totals(monthTx(txs, ym));
  const ytd = totals(ytdTx(txs, ym));
  const antes = totals(beforeTx(txs, ym));
  const bal = balances(txs.filter(t => ymOf(t.data) <= ym), cfg);
  const tetoYtd = Math.max(0, r2(cfg.presuncao / 100 * ytd.receita - (cfg.descontaDas ? ytd.das : 0)));
  const folgaTeto = Math.max(0, r2(tetoYtd - antes.retIsenta));
  const planejado = r2(cfg.pctIsento / 100 * mes.receita);
  const hist = totals(txs.filter(t => ymOf(t.data) <= ym));
  const histAntes = totals(txs.filter(t => ymOf(t.data) < ym));
  // lucro acumulado de todos os períodos que ainda está na empresa (o teto isento segue anual)
  const distribuivel = Math.max(0, r2(hist.resultado + (cfg.lucroInicial || 0) - histAntes.retiradas));
  const isentoSug = r2(Math.min(planejado, folgaTeto, distribuivel));
  const restoLucro = Math.max(0, r2(distribuivel - isentoSug));
  const tribBruto = restoLucro;
  const alvo = cfg.retiradaAlvo || 0;
  const tribSug0 = alvo > 0 ? Math.max(0, r2(Math.min(alvo - isentoSug, tribBruto))) : r2(tribBruto * (1 - cfg.reservaCaixa / 100));
  const caixaLivre = Math.max(0, r2(bal.cc - (cfg.caixaMin || 0)));
  let isento = Math.min(isentoSug, caixaLivre);
  let trib = Math.min(tribSug0, Math.max(0, r2(caixaLivre - isento)));
  isento = r2(isento); trib = r2(trib);
  const limitadoCaixa = (isento < isentoSug) || (trib < tribSug0);
  const limitadoTeto = planejado > folgaTeto;
  const faltaIsento = Math.max(0, r2(isento - mes.retIsenta));
  const faltaTrib = Math.max(0, r2(trib - mes.retTrib));
  const ini = cfg.abertura && Number(cfg.abertura.slice(0, 4)) === yOf(ym) ? Number(cfg.abertura.slice(5, 7)) : 1;
  const mesesAtivos = Math.max(1, Number(ym.slice(5, 7)) - ini + 1);
  const sustentavel = r2(Math.max(0, ytd.resultado) / mesesAtivos);
  const retido = Math.max(0, r2(distribuivel - isento - trib));
  const base = alvo > 0 ? alvo : sustentavel;
  const coberturaMeses = base > 0 ? r2(retido / base) : 0;
  return {
    alvo, sustentavel, retido, coberturaMeses,
    mes, ytd, antes, bal, tetoYtd, folgaTeto, planejado, distribuivel,
    isento, trib, limitadoCaixa, limitadoTeto,
    faltaIsento, faltaTrib, reservaIRvalor: r2(trib * cfg.reservaIR / 100),
    retidoNaEmpresa: r2(tribBruto - tribSug0), prejuizoYtd: distribuivel <= 0
  };
}

// Série mensal do ano para gráfico/relatório
function serieAno(txs, ano) {
  const out = [];
  for (let m = 1; m <= 12; m++) {
    const ym = ano + '-' + String(m).padStart(2, '0');
    out.push({ ym, m, ...totals(monthTx(txs, ym)) });
  }
  return out;
}

// DAS: competência -> pago? (despesa categoria DAS com comp preenchida, ou data no mês seguinte)
function statusDas(txs, ano, cfg, hoje) {
  const out = [];
  for (let m = 1; m <= 12; m++) {
    const comp = ano + '-' + String(m).padStart(2, '0');
    const pagos = txs.filter(t => t.tipo === 'despesa' && t.cat === 'DAS MEI' && (t.comp ? t.comp === comp : false));

function chartAno(serie) {
  const W = 600, H = 200, L = 44, B = 24, T = 10, R = 8;
  const max0 = Math.max(1000, ...serie.map(s => Math.max(s.receita, s.desp + s.das)));
  const step0 = max0 > 12000 ? 5000 : max0 > 6000 ? 2000 : max0 > 3000 ? 1000 : 500;
  const max = Math.ceil(max0 / step0) * step0;
  const y = v => T + (H - T - B) * (1 - v / max);
  const gw = (W - L - R) / 12, bw = gw * 0.34;
  let g = '';
  for (let v = 0; v <= max; v += step0) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${v >= 1000 ? (v / 1000) + 'k' : v}</text>`;
  serie.forEach((s, i) => {
    const x0 = L + i * gw + gw / 2;
    const d = s.desp + s.das;
    g += `<rect x="${x0 - bw - 1}" y="${y(s.receita)}" width="${bw}" height="${Math.max(0, y(0) - y(s.receita))}" rx="2" style="fill:var(--accent)"/>`;
    g += `<rect x="${x0 + 1}" y="${y(d)}" width="${bw}" height="${Math.max(0, y(0) - y(d))}" rx="2" style="fill:var(--neg)" opacity=".75"/>`;
    g += `<text x="${x0}" y="${H - 8}" text-anchor="middle" ${s.ym === S.ym ? 'style="font-weight:700;fill:var(--ink)"' : ''}>${MESES[i]}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Receitas e despesas por mês em ${S.ano}">${g}</svg>
  <div class="legend"><span><i class="dot" style="background:var(--accent)"></i>Receitas</span><span><i class="dot" style="background:var(--neg)"></i>Despesas e DAS</span></div>`;
}

function alertas(ap, lim, das) {
  const a = [];
  if (lim.nivel === 'critico') a.push(['bad', `Você passou de 120% do limite (${brl(lim.tolerancia)}). O desenquadramento vira retroativo. Fale com um contador agora.`]);
  else if (lim.nivel === 'excesso') a.push(['bad', `Faturamento acima do limite de ${brl(lim.limite)}. Dentro de 20% você continua MEI neste ano, paga DAS complementar sobre o excesso e migra para ME em janeiro.`]);
  else if (lim.nivel === 'atencao') a.push(['warn', `Você já usou ${pctf(lim.pct)} do limite anual. No ritmo atual, fecha o ano em ${brl(lim.projecao)}.`]);
  else if (lim.projecao > lim.limite) a.push(['warn', `Hoje você está dentro do limite, mas a projeção do ano é ${brl(lim.projecao)}, acima de ${brl(lim.limite)}.`]);
  const atras = das.filter(d => d.st === 'atrasado');
  if (atras.length) a.push(['bad', `DAS em atraso: ${atras.map(d => MESES[Number(d.comp.slice(5)) - 1]).join(', ')}. Multa de 0,33% ao dia (máximo 20%) mais juros.`]);
  if (ap.prejuizoYtd && S.tx.length) a.push(['warn', 'Não há lucro acumulado disponível para transferir. Retirar agora seria devolver capital, não distribuir lucro.']);
  if (ap.limitadoCaixa) a.push(['warn', 'A sugestão de transferência foi reduzida para manter o caixa mínimo na conta corrente.']);
  if (!a.length) a.push(['ok', 'Tudo em ordem: limite, DAS e caixa sem alertas neste momento.']);
  return `<div class="alerts">${a.map(([c, t]) => `<div class="alert ${c}">${esc(t)}</div>`).join('')}</div>`;
}

const FILTROS = [['todos', 'Todos'], ['receita', 'Receitas'], ['despesa', 'Despesas'], ['invest', 'Aplicações'], ['ret', 'Transferências']];
const grupoDe = t => t === 'receita' ? 'receita' : t === 'despesa' ? 'despesa' : (t === 'aplicacao' || t === 'resgate' || t === 'rendimento') ? 'invest' : (t === 'ret_isenta' || t === 'ret_trib') ? 'ret' : 'outros';
let delPend = null;

function txRow(t) {
  const k = TIPOS[t.tipo];
  const v = Number(t.valor) || 0;
  const flow = k.cc !== 0 ? k.cc * v : v;
  const cor = t.tipo === 'receita' || t.tipo === 'rendimento' ? 'pos' : (t.tipo === 'despesa' || t.tipo === 'ret_isenta' || t.tipo === 'ret_trib') ? 'neg' : '';
  const pills = [];
  if (t.tipo === 'receita' || t.tipo === 'despesa') pills.push(`<span class="pill"><i class="dot" style="background:${fonteCor(t.fonte)};margin-right:4px"></i>${esc(fonteNome(t.fonte))}</span>`);
  if (t.tipo === 'despesa') pills.push(`<span class="pill">${esc(t.cat || 'Outras despesas')}</span>`);
  if (t.cat === 'DAS MEI' && t.comp) pills.push(`<span class="pill info">competência ${esc(t.comp.slice(5))}/${esc(t.comp.slice(0, 4))}</span>`);
  if (t.tipo === 'receita') pills.push(t.nf ? '<span class="pill ok">com nota</span>' : '<span class="pill warn">sem nota</span>');
  if (t.tipo !== 'receita' && t.tipo !== 'despesa') pills.push(`<span class="pill info">${esc(k.nome)}</span>`);
  const conf = delPend === t.id;
  return `<div class="tx"><span class="d">${fmtData(t.data)}</span><span class="t"><b>${esc(t.desc || k.nome)}</b></span><span class="a ${cor}">${k.cc === 0 ? '+' : (flow < 0 ? '−' : '+')}${brl(Math.abs(v))}</span>
    <div class="x">${pills.join('')}<span style="flex:1"></span>
      <button class="link" data-act="edit" data-id="${esc(t.id)}">Editar</button>
      <button class="link danger" data-act="${conf ? 'delok' : 'del'}" data-id="${esc(t.id)}">${conf ? 'Confirmar exclusão' : 'Excluir'}</button></div></div>`;
}

  const falta = r2(ap.faltaIsento + ap.faltaTrib);

/* ===== Telas: obrigações e ajustes ===== */
const DAS_ST = { pago: ['ok', 'Pago'], atrasado: ['bad', 'Atrasado'], aberto: ['warn', 'Em aberto'], futuro: ['', 'Futuro'], antes: ['', 'Antes da abertura'] };

function rmrbCsv() {
  const linhas = [['Mês', 'Serviços com nota fiscal', 'Serviços sem nota fiscal', 'Total do mês']];
  for (let m = 1; m <= 12; m++) {
    const x = rmrb(S.tx, S.ano + '-' + String(m).padStart(2, '0'));
    linhas.push([MESES_L[m - 1], x.servicosComNF.toFixed(2).replace('.', ','), x.servicosSemNF.toFixed(2).replace('.', ','), x.total.toFixed(2).replace('.', ',')]);
  }
  return linhas.map(l => l.join(';')).join('\n');
}

  const lim = limiteMei(S.tx, S.ano, S.cfg, hojeISO);
  const das = statusDas(S.tx, S.ano, S.cfg, hojeISO);
  const tAno = totals(S.tx.filter(t => yOf(t.data) === S.ano));
  const pctBar = Math.min(1, lim.receita / (lim.limite * 1.2));
  const cls = lim.nivel === 'ok' ? '' : lim.nivel === 'atencao' ? 'warn' : 'bad';
  const nivelTxt = { ok: ['ok', 'Dentro do limite'], atencao: ['warn', 'Perto do limite'], excesso: ['bad', 'Acima do limite'], critico: ['bad', 'Acima de 120%'] }[lim.nivel];
  const rows = [];
  for (let m = 1; m <= 12; m++) { const x = rmrb(S.tx, S.ano + '-' + String(m).padStart(2, '0')); rows.push(`<tr><td>${MESES_L[m - 1]}</td><td class="r">${brl(x.servicosComNF)}</td><td class="r">${brl(x.servicosSemNF)}</td><td class="r">${brl(x.total)}</td></tr>`); }
  return `
  <div class="card hi"><h2>Limite de faturamento ${S.ano}</h2>
    <div style="margin:8px 0 12px"><span class="pill ${nivelTxt[0]}">${nivelTxt[1]}</span></div>
    <div class="gauge"><i class="${cls}" style="width:${(pctBar * 100).toFixed(1)}%"></i><u style="left:${(100 / 1.2).toFixed(2)}%"></u></div>

const parseNum = s => { s = String(s).trim().replace(/[R$\s]/g, ''); if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); const n = Number(s); return isFinite(n) ? n : NaN; };

async function saveFile(filename, data, label) {
  let dl = null; try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
  if (!dl) {
    if (window.claude) { toast('Baixar arquivo não está disponível nesta tela.'); return; }
    try { const bl = new Blob([filename.endsWith('.csv') ? '\ufeff' + data : data], { type: 'text/plain;charset=utf-8' }); const u = URL.createObjectURL(bl); const an = document.createElement('a'); an.href = u; an.download = filename; document.body.appendChild(an); an.click(); an.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000); toast(label + ' salvo'); } catch (x) { toast('Não foi possível salvar o arquivo.'); }
    return;
  }
  try { await dl.save({ filename, data }); toast(label + ' salvo'); } catch (e) { if (e && e.code !== 'declined') toast('Não foi possível salvar o arquivo.'); }
}
const txCsv = () => ['Data;Tipo;Atividade;Categoria;Valor;Nota fiscal;Competência DAS;Descrição'].concat([...S.tx].sort((a, b) => a.data.localeCompare(b.data)).map(t => [t.data, TIPOS[t.tipo].nome, t.fonte ? fonteNome(t.fonte) : '', t.cat || '', Number(t.valor).toFixed(2).replace('.', ','), t.tipo === 'receita' ? (t.nf ? 'sim' : 'não') : '', t.comp || '', '"' + String(t.desc || '').replace(/"/g, '""') + '"'].join(';'))).join('\n');

function readNum(id, min, max) { const n = parseNum($(id).value); return isFinite(n) ? Math.min(max, Math.max(min, n)) : null; }

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  if (a === 'tab') { S.tab = el.dataset.v; delPend = null; render(); window.scrollTo(0, 0); }

  else if (a === 'edit') openForm(S.tx.find(t => t.id === el.dataset.id));
  else if (a === 'del') { delPend = el.dataset.id; render(); }
  else if (a === 'delok') { try { await Store.delTx(el.dataset.id); toast('Lançamento excluído'); } catch (x) { toast('Não foi possível excluir agora.'); } delPend = null; render(); }
  else if (a === 'close') closeSheet();
  else if (a === 'start') openStart();
  else if (a === 'startok') { try { await Store.start(); } catch (x) { toast('Não foi possível iniciar agora.'); } closeSheet(); render(); toast('Caixa vazio. Pode lançar.'); }
  else if (a === 'saveCfg') {
    const c = S.cfg, nome = $('#c_nome').value.trim();
    const das = readNum('#c_das', 0, 1000), lim = readNum('#c_limite', 1000, 10000000), pct = readNum('#c_pct', 0, 100), pres = readNum('#c_pres', 0, 100), rcx = readNum('#c_rcx', 0, 100), rir = readNum('#c_rir', 0, 100), cmin = readNum('#c_cmin', 0, 10000000), alvo = readNum('#c_alvo', 0, 10000000), lucro = readNum('#c_lucro', 0, 100000000), cc0 = readNum('#c_cc0', -10000000, 100000000), inv0 = readNum('#c_inv0', 0, 100000000);
    if ([das, lim, pct, pres, rcx, rir, cmin, alvo, lucro, cc0, inv0].some(v => v === null)) { toast('Confira os números: algum campo está inválido.'); return; }
    Object.assign(c, { nome: nome || 'Meu MEI', das, limite: lim, pctIsento: pct, presuncao: pres, reservaCaixa: rcx, reservaIR: rir, caixaMin: cmin, retiradaAlvo: alvo, lucroInicial: lucro, saldoCC0: cc0, saldoInv0: inv0, abertura: $('#c_abertura').value, descontaDas: $('#c_das_abate').checked });
    try { await Store.saveCfg(); toast('Ajustes salvos'); } catch (x) { toast('Não foi possível salvar agora.'); } render();
  }
  else if (a === 'gconnect') { GS.busy = true; GS.err = ''; render(); try { await Store.gConnect(true); } catch (x) { GS.err = /popup|closed|access_denied|cancel/i.test(x.message) ? 'Login cancelado ou permissão negada. Tente de novo.' : 'Não foi possível conectar: ' + x.message; } GS.busy = false; render(); }
  else if (a === 'grefresh') { await Store.gRefresh(); render(); toast('Dados atualizados da planilha'); }
  else if (a === 'gdisc') { Store.gDisconnect(); render(); }

    const dt = $('#cf_data').value, out = $('#cfRes');
    const ccv = $('#cf_cc').value.trim(), invv = $('#cf_inv').value.trim();
    if (!/^\d{4}-\d{2}-\d{2}$/.test(dt) || (!ccv && !invv)) { out.innerHTML = '<p class="small neg" style="margin-top:8px">Informe a data e pelo menos um saldo do extrato.</p>'; return; }
    const b = balances(S.tx.filter(t => t.data <= dt), S.cfg);
    const bloco = (nome, app, txt, inv) => {
      if (!txt) return '';
      const v = parseNum(txt); if (!isFinite(v)) return `<p class="small neg" style="margin-top:8px">O saldo de ${nome} não é um número válido.</p>`;

      if (!ok && inv) dica = d > 0 ? `<p class="small" style="margin-top:6px">A aplicação tem ${brl(d)} a mais. Provável rendimento sem lançar.</p><button class="btn sm" style="margin-top:6px" data-act="novo" data-tipo="rendimento" data-valor="${d}">Lançar como rendimento líquido</button>` : `<p class="small" style="margin-top:6px">A aplicação tem ${brl(-d)} a menos. Provável imposto retido, aplicação ou resgate sem lançar.</p>`;

  else if (a === 'rmrbCsv') saveFile('receitas-brutas-' + S.ano + '.csv', rmrbCsv(), 'Relatório');
  else if (a === 'rmrbCopy') { try { await navigator.clipboard.writeText(rmrbCsv().replace(/;/g, '\t')); toast('Texto copiado'); } catch (x) { openSheet(`<h2>Copie o texto</h2><textarea id="cp" rows="12" style="width:100%;font-family:var(--f-mono);font-size:.8rem">${esc(rmrbCsv().replace(/;/g, '\t'))}</textarea><button class="btn alt" data-act="close">Fechar</button>`); const ta = $('#cp'); ta.focus(); ta.select(); } }

  else if (a === 'exportCsv') saveFile('lancamentos.csv', txCsv(), 'Arquivo');

document.addEventListener('change', async e => {

        const ok = d.tx.filter(x => x && TIPOS[x.tipo] && /^\d{4}-\d{2}-\d{2}$/.test(x.data) && Number(x.valor) > 0);
        if (S.example) { S.tx = []; S.example = false; }
        if (d.cfg) S.cfg = { ...DEFAULT_CFG, ...d.cfg, fontes: DEFAULT_CFG.fontes };
        await Store.saveCfg();
        await Store.saveMany(ok.map(x => ({ ...x, id: x.id || newId() })));
        toast(ok.length + ' lançamentos importados'); render();
      } catch (x) { toast('Arquivo inválido. Use um backup baixado por este app.'); }
    };
    rd.readAsText(t.files[0]); t.value = '';
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheetbg').hidden) closeSheet(); });
document.addEventListener('click', e => { if (e.target.id === 'sheetbg') closeSheet(); });

function render() {
  renderHeader(); renderNav();
  const v = { painel: viewPainel, lanc: viewLanc, apur: viewApur, obrig: viewObrig, ajustes: viewAjustes }[S.tab];
  const precisaConectar = Store.mode === 'sheets' && !GS.connected;
  $('#view').innerHTML = precisaConectar ? viewConectar() : v();
  $('#fab').hidden = precisaConectar || S.tab === 'ajustes';
}
const aoMudar = () => { const ae = document.activeElement; const digitando = ae && ['INPUT', 'SELECT', 'TEXTAREA'].includes(ae.tagName) && ae.closest('#view'); if (S.tab !== 'ajustes' && $('#sheetbg').hidden && !digitando) render(); else renderHeader(); };
if (window.MEI_CONFIG && window.MEI_CONFIG.googleClientId) {
  S.example = false; S.tx = []; Store.mode = 'sheets'; S.storage = 'sheets'; render();
  Store.initSheets(aoMudar);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Store.mode === 'sheets' && GS.connected && Date.now() - GS.last > 30000) Store.gRefresh(); });
} else {
  Store.localLoad();
  if (S.example) S.tx = exampleData(S.ano, Number(hojeISO.slice(5, 7)));
  render();
  Store.init(aoMudar);
}

</script>
</body>
</html>
