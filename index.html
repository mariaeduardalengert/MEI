<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<style>body{margin:0}</style>
<title>Caixa MEI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: caderneta de caixa. Cabeçalho com ano/mês, abas (rodapé no celular, topo no desktop), cartões de apuração e lista de lançamentos. */
:root {
  --bg:#EDF1F0; --surface:#FFFFFF; --surface2:#F4F7F6; --ink:#101C1A; --ink2:#4A5B58; --line:#D5DDDB;
  --accent:#2146C7; --accent-ink:#FFFFFF; --accent-bg:#E4EAFB;
  --pos:#0F7B4F; --pos-bg:#E1F2E9; --neg:#B42318; --neg-bg:#FBE7E4; --warn:#9A6200; --warn-bg:#FBF0D9;
  --com:#B4540A; --pat:#0E7490;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Instrument Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(16,28,26,.06),0 6px 18px rgba(16,28,26,.06);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#0B1312; --surface:#131D1B; --surface2:#192624; --ink:#E6EEEC; --ink2:#9DB0AC; --line:#263633;
  --accent:#8FA8FF; --accent-ink:#0B1312; --accent-bg:#1B2748;
  --pos:#4FD39A; --pos-bg:#12332A; --neg:#FF8A7A; --neg-bg:#3A1C18; --warn:#E8B64F; --warn-bg:#35290F;
  --com:#F0A15C; --pat:#5CCBE6; --shadow:none; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg:#0B1312; --surface:#131D1B; --surface2:#192624; --ink:#E6EEEC; --ink2:#9DB0AC; --line:#263633;
  --accent:#8FA8FF; --accent-ink:#0B1312; --accent-bg:#1B2748;
  --pos:#4FD39A; --pos-bg:#12332A; --neg:#FF8A7A; --neg-bg:#3A1C18; --warn:#E8B64F; --warn-bg:#35290F;
  --com:#F0A15C; --pat:#5CCBE6; --shadow:none; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display:none !important; }
body { background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.45; padding-inline:16px; padding-block:0 96px; }
h1,h2,h3 { font-family:var(--f-display); font-weight:700; margin:0; text-wrap:balance; letter-spacing:-.01em; }
h2 { font-size:1.15rem; } h3 { font-size:1rem; }
p { margin:0; }
button,input,select,textarea { font:inherit; color:inherit; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.num { font-family:var(--f-mono); font-variant-numeric:tabular-nums; }
.wrap { max-width:980px; margin-inline:auto; }
.muted { color:var(--ink2); }
.small { font-size:.82rem; }
.eyebrow { font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:var(--ink2); font-weight:600; }
.pos { color:var(--pos); } .neg { color:var(--neg); } .warnc { color:var(--warn); }

header.top { position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bg); padding-block:12px 10px; border-bottom:1px solid var(--line); }
.top .wrap { display:flex; gap:10px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
.brand { display:flex; flex-direction:column; min-width:0; }
.brand b { font-family:var(--f-display); font-size:1.2rem; }
.brand span { font-size:.78rem; color:var(--ink2); }
.pick { display:flex; gap:6px; align-items:center; }
.pick select, .pick button { background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:7px 10px; min-height:36px; }
.pick button { cursor:pointer; }

nav.tabs { position:fixed; left:0; right:0; bottom:0; z-index:6; background:var(--surface); border-top:1px solid var(--line); display:flex; padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px)); gap:2px; }
nav.tabs button { flex:1; background:none; border:0; padding:8px 2px; border-radius:8px; color:var(--ink2); font-size:.74rem; font-weight:600; cursor:pointer; min-width:0; }
nav.tabs { overflow-x:auto; scrollbar-width:none; }
nav.tabs::-webkit-scrollbar { display:none; }
nav.tabs button { flex:1 0 auto; padding-inline:9px; white-space:nowrap; }
nav.tabs button[aria-current="page"] { color:var(--accent); background:var(--accent-bg); }
@media (min-width: 760px) {
  nav.tabs { position:static; border:0; background:none; max-width:980px; margin:10px auto 0; padding:0; gap:6px; }
  nav.tabs button { flex:none; padding:8px 16px; font-size:.9rem; }
  body { padding-block:0 60px; }
}
main { max-width:980px; margin-inline:auto; padding-block:16px; display:grid; gap:14px; }
.grid2 { display:grid; gap:14px; grid-template-columns:1fr; }
.grid3 { display:grid; gap:10px; grid-template-columns:1fr 1fr; }
@media (min-width: 760px) { .grid2 { grid-template-columns:1fr 1fr; } .grid3 { grid-template-columns:repeat(4,1fr); } }
.card { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px; min-width:0; }
.card.flat { background:var(--surface2); }
.card.hi { box-shadow:var(--shadow); }
.card > h2, .card > h3 { margin-bottom:10px; }
.kpi { display:flex; flex-direction:column; gap:2px; min-width:0; }
.kpi .v { font-family:var(--f-mono); font-size:1.25rem; font-weight:500; overflow-wrap:anywhere; }
.kpi .s { font-size:.78rem; color:var(--ink2); }
.hero .v { font-size:1.9rem; }

.pill { display:inline-block; font-size:.72rem; font-weight:600; padding:2px 8px; border-radius:99px; background:var(--surface2); border:1px solid var(--line); color:var(--ink2); white-space:nowrap; }
.pill.ok { background:var(--pos-bg); color:var(--pos); border-color:transparent; }
.pill.bad { background:var(--neg-bg); color:var(--neg); border-color:transparent; }
.pill.warn { background:var(--warn-bg); color:var(--warn); border-color:transparent; }
.pill.info { background:var(--accent-bg); color:var(--accent); border-color:transparent; }
.dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; }

.gauge { height:12px; border-radius:99px; background:var(--surface2); border:1px solid var(--line); position:relative; overflow:hidden; }
.gauge i { position:absolute; inset:0 auto 0 0; background:var(--accent); border-radius:99px; }
.gauge i.warn { background:var(--warn); } .gauge i.bad { background:var(--neg); }
.gauge u { position:absolute; top:-1px; bottom:-1px; width:2px; background:var(--ink); opacity:.5; }

.list { display:grid; }
.tx { display:grid; grid-template-columns:auto 1fr auto; gap:4px 10px; align-items:center; padding:10px 0; border-top:1px solid var(--line); }
.tx:first-child { border-top:0; }
.tx .d { font-family:var(--f-mono); font-size:.78rem; color:var(--ink2); }
.tx .t { min-width:0; overflow-wrap:anywhere; }
.tx .t b { font-weight:600; }
.tx .a { font-family:var(--f-mono); font-weight:500; text-align:right; }
.tx .x { grid-column:2 / 4; display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
.link { background:none; border:0; padding:2px 4px; color:var(--accent); cursor:pointer; font-size:.82rem; text-decoration:underline; }
.link.danger { color:var(--neg); }

.tbl { width:100%; border-collapse:collapse; font-size:.9rem; }
.tbl th,.tbl td { text-align:left; padding:7px 6px; border-top:1px solid var(--line); }
.tbl th { font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--ink2); border-top:0; }
.tbl td.r, .tbl th.r { text-align:right; font-family:var(--f-mono); font-variant-numeric:tabular-nums; }
.tbl tr.sum td { font-weight:600; border-top:2px solid var(--ink); }
.scroll { overflow-x:auto; }

.btn { background:var(--accent); color:var(--accent-ink); border:0; border-radius:9px; padding:10px 16px; min-height:42px; font-weight:600; cursor:pointer; }
.btn.alt { background:var(--surface); color:var(--ink); border:1px solid var(--line); }
.btn.sm { padding:6px 12px; min-height:34px; font-size:.86rem; }
.btn[disabled] { opacity:.5; cursor:not-allowed; }
.fab { position:fixed; right:16px; bottom:calc(72px + env(safe-area-inset-bottom,0px)); z-index:7; border-radius:99px; padding:12px 20px; box-shadow:0 6px 18px rgba(0,0,0,.25); }
@media (min-width: 760px) { .fab { bottom:24px; } }

.banner { background:var(--warn-bg); color:var(--ink); border:1px solid var(--line); border-radius:12px; padding:12px 14px; display:flex; gap:10px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
.alerts { display:grid; gap:8px; }
.alert { border-radius:10px; padding:10px 12px; font-size:.9rem; border:1px solid var(--line); background:var(--surface); }
.alert.bad { background:var(--neg-bg); border-color:transparent; }
.alert.warn { background:var(--warn-bg); border-color:transparent; }
.alert.ok { background:var(--pos-bg); border-color:transparent; }

.sheetbg { position:fixed; inset:0; background:rgba(8,14,13,.55); z-index:20; display:flex; align-items:flex-end; justify-content:center; }
.sheet { background:var(--surface); width:100%; max-width:560px; max-height:92%; overflow:auto; border-radius:16px 16px 0 0; padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px)); display:grid; gap:12px; }
@media (min-width: 760px) { .sheetbg { align-items:center; } .sheet { border-radius:16px; } }
.seg { display:flex; flex-wrap:wrap; gap:6px; }
.seg label { flex:1 1 auto; }
.seg input { position:absolute; opacity:0; pointer-events:none; }
.seg span { display:block; text-align:center; padding:8px 10px; border:1px solid var(--line); border-radius:9px; background:var(--surface2); cursor:pointer; font-size:.88rem; font-weight:500; }
.seg input:checked + span { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
.seg input:focus-visible + span { outline:2px solid var(--accent); outline-offset:2px; }
.field { display:grid; gap:4px; min-width:0; }
.field label, .field .l { font-size:.78rem; font-weight:600; color:var(--ink2); }
.field input, .field select, .field textarea { background:var(--surface2); border:1px solid var(--line); border-radius:9px; padding:10px; min-height:42px; width:100%; min-width:0; }
.frow { display:grid; gap:10px; grid-template-columns:1fr 1fr; }
.check { display:flex; gap:8px; align-items:center; font-size:.92rem; }
.check input { width:20px; height:20px; }
.toast { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(130px + env(safe-area-inset-bottom,0px)); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:99px; z-index:30; font-size:.9rem; max-width:90%; }
.steps { display:grid; gap:0; }
.step { display:flex; justify-content:space-between; gap:12px; padding:9px 0; border-top:1px solid var(--line); align-items:baseline; }
.step:first-child { border-top:0; }
.step.total { border-top:2px solid var(--ink); font-weight:600; }
.step .n { font-family:var(--f-mono); font-variant-numeric:tabular-nums; white-space:nowrap; }
.chart { width:100%; height:auto; display:block; }
.chart text { fill:var(--ink2); font-family:var(--f-mono); font-size:10px; }
.legend { display:flex; gap:14px; flex-wrap:wrap; font-size:.8rem; color:var(--ink2); margin-top:6px; }
.months { display:grid; grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:8px; }
.mcell { background:var(--surface2); border:1px solid var(--line); border-radius:10px; padding:8px; display:grid; gap:4px; font-size:.78rem; }
.mcell b { font-size:.82rem; }
details summary { cursor:pointer; font-weight:600; }
.dre { font-size:.8rem; }
.dre th, .dre td { white-space:nowrap; padding:6px 7px; }
.dre th:first-child, .dre td:first-child { position:sticky; left:0; background:var(--surface); z-index:1; min-width:150px; }
.dre td.cur, .dre th.cur { background:var(--accent-bg); }
.dre td.tot { font-weight:600; border-left:1px solid var(--line); }
.dre tr.secrow td, .tbl tr.secrow td { background:var(--surface2); font-weight:700; font-size:.74rem; text-transform:uppercase; letter-spacing:.05em; color:var(--ink2); }
.dre tr.secrow td:first-child { position:sticky; left:0; }
.printonly { display:none; }
@media print {
  header.top, nav.tabs, .fab, .noprint, .sheetbg, .toast { display:none !important; }
  .printonly { display:block !important; }
  body { background:#fff; color:#000; padding:0; }
  .card { border:0; box-shadow:none; padding:0; background:#fff; }
  .scroll { overflow:visible; }
  .dre { font-size:8pt; } .dre th, .dre td { padding:2px 3px; }
  .dre th:first-child, .dre td:first-child { position:static; min-width:0; }
}
@media (prefers-reduced-motion: no-preference) { .gauge i { transition: width .4s ease; } }
</style>
</head>
<body>
<header class="top" id="hdr"></header>
<nav class="tabs" id="nav" aria-label="Seções"></nav>
<main id="view"></main>
<button class="btn fab" id="fab" data-act="novo" data-tipo="receita">+ Lançar</button>
<div class="sheetbg" id="sheetbg" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="config.js"></script>
<script>
/* ===== Cálculos (puros, regime de caixa) ===== */
const DEF_CC = 'conta-corrente', DEF_INV = 'aplicacoes'; // contas padrão: lançamentos antigos, sem conta, caem nelas
const TIPOS_CONTA = { corrente: 'Conta corrente', aplicacao: 'Aplicação', especie: 'Dinheiro em espécie' };
const CATS = ['DAS MEI','Anúncios e tráfego pago','Software e assinaturas','Equipamentos','Pista, gelo e aluguel de espaço','Figurinos e material','Transporte','Internet e telefone','Contador e serviços','Tarifas bancárias','Cursos e capacitação','Outras despesas'];
const CATS_REC = ['Contrato mensal', 'Serviço avulso', 'Mensalidades', 'Aulas particulares', 'Outras receitas'];
const DEFAULT_CFG = {
  nome: 'Meu MEI',
  das: 86.05,            // DAS serviços 2026 (INSS 81,05 + ISS 5,00)
  limite: 81000,
  presuncao: 32,         // % de presunção de lucro isento para serviços
  descontaDas: true,     // abate o DAS pago do teto isento (leitura conservadora)
  pctIsento: 32,         // % do faturamento que você transfere como lucro isento
  reservaCaixa: 10,      // % do lucro tributável que fica na empresa
  lucroInicial: 0,       // lucro já guardado na empresa antes de começar a usar o app
  retiradaAlvo: 0,       // quanto você quer receber por mês (0 = desligado)
  caixaMin: 2000,        // colchão mínimo que fica nas contas e no caixa em espécie
  reservaIR: 0,          // % estimada para separar para o IRPF do tributável
  abertura: '',          // AAAA-MM, só preencher se abriu o MEI no ano corrente
  contas: [
    { id: DEF_CC, nome: 'Conta corrente', tipo: 'corrente', saldo0: 0, ativa: true },
    { id: DEF_INV, nome: 'Aplicações', tipo: 'aplicacao', saldo0: 0, ativa: true }
  ],
  catsRec: CATS_REC.slice(),
  catsDesp: CATS.slice(),
  fontes: [
    { id: 'com', nome: 'Comunicação e Marketing', cor: 'var(--com)' },
    { id: 'pat', nome: 'Aulas de Patinação', cor: 'var(--pat)' }
  ]
};
const TIPOS = {
  receita:   { nome: 'Receita' },
  despesa:   { nome: 'Despesa' },
  aplicacao: { nome: 'Aplicação' },
  resgate:   { nome: 'Resgate' },
  transf:    { nome: 'Transferência entre contas' },
  rendimento:{ nome: 'Rendimento líquido' },
  ret_isenta:{ nome: 'Lucro isento' },
  ret_trib:  { nome: 'Lucro tributável' },
  aporte:    { nome: 'Aporte do titular' }
};
const slug = s => String(s == null ? '' : s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');

// Normaliza a configuração vinda do disco: migra saldos antigos para contas e garante as listas de categorias
function mkCfg(o) {
  o = o || {};
  const c = { ...structuredClone(DEFAULT_CFG), ...o };
  c.fontes = structuredClone(DEFAULT_CFG.fontes);
  let contas = Array.isArray(o.contas) ? o.contas.filter(x => x && x.id).map(x => ({ id: String(x.id), nome: String(x.nome || x.id), tipo: TIPOS_CONTA[x.tipo] ? x.tipo : 'corrente', saldo0: Number(x.saldo0) || 0, ativa: x.ativa !== false })) : [];
  if (!contas.some(x => x.id === DEF_CC)) contas.unshift({ id: DEF_CC, nome: 'Conta corrente', tipo: 'corrente', saldo0: Number(o.saldoCC0) || 0, ativa: true });
  if (!contas.some(x => x.id === DEF_INV)) contas.splice(1, 0, { id: DEF_INV, nome: 'Aplicações', tipo: 'aplicacao', saldo0: Number(o.saldoInv0) || 0, ativa: true });
  c.contas = contas;
  const lista = (v, def) => { const a = Array.isArray(v) ? v.map(x => String(x).trim()).filter(Boolean) : []; return a.length ? [...new Set(a)] : def.slice(); };
  c.catsRec = lista(o.catsRec, CATS_REC);
  c.catsDesp = lista(o.catsDesp, CATS).filter(x => x !== 'DAS MEI');
  c.catsDesp.unshift('DAS MEI');
  delete c.saldoCC0; delete c.saldoInv0;
  return c;
}
const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const ymOf = d => String(d).slice(0, 7);
const yOf = d => Number(String(d).slice(0, 4));

function sumTx(txs, f) { let s = 0; for (const t of txs) if (f(t)) s += Number(t.valor) || 0; return r2(s); }

const contaTipo = (cfg, id) => { const c = ((cfg && cfg.contas) || []).find(x => x.id === id); return c ? c.tipo : (id === DEF_INV ? 'aplicacao' : 'corrente'); };
const contaNomeDe = (cfg, id) => { const c = ((cfg && cfg.contas) || []).find(x => x.id === id); return c ? c.nome : (id === DEF_INV ? 'Aplicações' : id === DEF_CC ? 'Conta corrente' : id + ' (removida)'); };

// Efeito de um lançamento em cada conta: lista de [idDaConta, variação]
function efeitos(t) {
  const v = Number(t.valor) || 0;
  switch (t.tipo) {
    case 'receita': case 'aporte': return [[t.conta || DEF_CC, v]];
    case 'despesa': case 'ret_isenta': case 'ret_trib': return [[t.conta || DEF_CC, -v]];
    case 'rendimento': return [[t.conta || DEF_INV, v]];
    case 'aplicacao': return [[t.conta || DEF_CC, -v], [t.destino || DEF_INV, v]];
    case 'resgate': return [[t.conta || DEF_INV, -v], [t.destino || DEF_CC, v]];
    case 'transf': return [[t.conta || DEF_CC, -v], [t.destino || DEF_CC, v]];
  }
  return [];
}

// cc = dinheiro disponível (contas correntes + espécie); inv = aplicações; por = saldo de cada conta
function balances(txs, cfg) {
  const por = {};
  for (const c of ((cfg && cfg.contas) || [])) por[c.id] = Number(c.saldo0) || 0;
  for (const t of txs) for (const [id, d] of efeitos(t)) por[id] = (por[id] || 0) + d;
  let cc = 0, inv = 0;
  for (const id in por) { por[id] = r2(por[id]); if (contaTipo(cfg, id) === 'aplicacao') inv += por[id]; else cc += por[id]; }
  return { cc: r2(cc), inv: r2(inv), por };
}

// Totais de um conjunto de lançamentos já filtrado por período
function totals(txs) {
  const t = { receita: 0, porFonte: {}, desp: 0, das: 0, rend: 0, retIsenta: 0, retTrib: 0, aplic: 0, resg: 0, aporte: 0, comNF: 0, semNF: 0 };
  for (const x of txs) {
    const v = Number(x.valor) || 0;
    if (x.tipo === 'receita') { t.receita += v; t.porFonte[x.fonte] = (t.porFonte[x.fonte] || 0) + v; if (x.nf) t.comNF += v; else t.semNF += v; }
    else if (x.tipo === 'despesa') { if (x.cat === 'DAS MEI') t.das += v; else t.desp += v; }
    else if (x.tipo === 'rendimento') t.rend += v;
    else if (x.tipo === 'ret_isenta') t.retIsenta += v;
    else if (x.tipo === 'ret_trib') t.retTrib += v;
    else if (x.tipo === 'aplicacao') t.aplic += v;
    else if (x.tipo === 'resgate') t.resg += v;
    else if (x.tipo === 'aporte') t.aporte += v;
  }
  for (const k in t) if (typeof t[k] === 'number') t[k] = r2(t[k]);
  for (const k in t.porFonte) t.porFonte[k] = r2(t.porFonte[k]);
  t.resultado = r2(t.receita - t.desp - t.das + t.rend);
  t.retiradas = r2(t.retIsenta + t.retTrib);
  return t;
}
const monthTx = (txs, ym) => txs.filter(t => ymOf(t.data) === ym);
// Do mês 01 até o mês informado (inclusive) / só meses anteriores
const ytdTx = (txs, ym) => txs.filter(t => yOf(t.data) === yOf(ym) && ymOf(t.data) <= ym);
const beforeTx = (txs, ym) => txs.filter(t => yOf(t.data) === yOf(ym) && ymOf(t.data) < ym);

// Limite de faturamento (só receitas de atividade; rendimento financeiro não entra)
function limiteMei(txs, ano, cfg, hoje) {
  const rec = totals(txs.filter(t => yOf(t.data) === ano)).receita;
  let meses = 12;
  if (cfg.abertura && Number(cfg.abertura.slice(0, 4)) === ano) meses = 12 - Number(cfg.abertura.slice(5, 7)) + 1;
  const lim = r2(cfg.limite / 12 * meses);
  const hojeAno = Number(String(hoje).slice(0, 4));
  let decorridos = 12;
  if (ano === hojeAno) decorridos = Number(String(hoje).slice(5, 7));
  if (ano > hojeAno) decorridos = 1;
  const ini = cfg.abertura && Number(cfg.abertura.slice(0, 4)) === ano ? Number(cfg.abertura.slice(5, 7)) : 1;
  const ativos = Math.max(1, decorridos - ini + 1);
  const projecao = r2(rec / ativos * meses);
  const pct = lim ? rec / lim : 0;
  const tol = r2(lim * 1.2);
  let nivel = 'ok';
  if (rec > tol) nivel = 'critico'; else if (rec > lim) nivel = 'excesso'; else if (pct >= 0.8) nivel = 'atencao';
  return { receita: rec, limite: lim, tolerancia: tol, folga: r2(lim - rec), pct, projecao, nivel, meses, mediaMes: r2(rec / ativos) };
}

// Apuração do mês e sugestão de retirada
function apuracao(txs, ym, cfg) {
  const mes = totals(monthTx(txs, ym));
  const ytd = totals(ytdTx(txs, ym));
  const antes = totals(beforeTx(txs, ym));
  const bal = balances(txs.filter(t => ymOf(t.data) <= ym), cfg);
  const tetoYtd = Math.max(0, r2(cfg.presuncao / 100 * ytd.receita - (cfg.descontaDas ? ytd.das : 0)));
  const folgaTeto = Math.max(0, r2(tetoYtd - antes.retIsenta));
  // Plano acumulado: pct% da receita do ano até este mês, menos o isento já transferido nos meses anteriores.
  // Assim o que ficou de fora em meses passados (dentro do teto) volta para a sugestão.
  const planejadoMes = r2(cfg.pctIsento / 100 * mes.receita);
  const planejado = Math.max(0, r2(cfg.pctIsento / 100 * ytd.receita - antes.retIsenta));
  const carry = r2(planejado - planejadoMes);
  const hist = totals(txs.filter(t => ymOf(t.data) <= ym));
  const histAntes = totals(txs.filter(t => ymOf(t.data) < ym));
  // lucro acumulado de todos os períodos que ainda está na empresa (o teto isento segue anual)
  const distribuivel = Math.max(0, r2(hist.resultado + (cfg.lucroInicial || 0) - histAntes.retiradas));
  const isentoSug = r2(Math.min(planejado, folgaTeto, distribuivel));
  const restoLucro = Math.max(0, r2(distribuivel - isentoSug));
  const tribBruto = restoLucro;
  const alvo = cfg.retiradaAlvo || 0;
  const tribSug0 = alvo > 0 ? Math.max(0, r2(Math.min(alvo - isentoSug, tribBruto))) : r2(tribBruto * (1 - cfg.reservaCaixa / 100));
  const caixaLivre = Math.max(0, r2(bal.cc - (cfg.caixaMin || 0)));
  let isento = Math.min(isentoSug, caixaLivre);
  let trib = Math.min(tribSug0, Math.max(0, r2(caixaLivre - isento)));
  isento = r2(isento); trib = r2(trib);
  const limitadoCaixa = (isento < isentoSug) || (trib < tribSug0);
  const limitadoTeto = planejado > folgaTeto;
  const faltaIsento = Math.max(0, r2(isento - mes.retIsenta));
  const faltaTrib = Math.max(0, r2(trib - mes.retTrib));
  const ini = cfg.abertura && Number(cfg.abertura.slice(0, 4)) === yOf(ym) ? Number(cfg.abertura.slice(5, 7)) : 1;
  const mesesAtivos = Math.max(1, Number(ym.slice(5, 7)) - ini + 1);
  const sustentavel = r2(Math.max(0, ytd.resultado) / mesesAtivos);
  const retido = Math.max(0, r2(distribuivel - isento - trib));
  const base = alvo > 0 ? alvo : sustentavel;
  const coberturaMeses = base > 0 ? r2(retido / base) : 0;
  return {
    alvo, sustentavel, retido, coberturaMeses,
    mes, ytd, antes, bal, tetoYtd, folgaTeto, planejado, planejadoMes, carry, distribuivel,
    isento, trib, limitadoCaixa, limitadoTeto,
    faltaIsento, faltaTrib, reservaIRvalor: r2(trib * cfg.reservaIR / 100),
    retidoNaEmpresa: r2(tribBruto - tribSug0), prejuizoYtd: distribuivel <= 0
  };
}

// DAS: competência -> pago? (despesa categoria DAS com comp preenchida, ou data no mês seguinte)
function statusDas(txs, ano, cfg, hoje) {

// Extrato de uma conta no período [de, ate] (datas AAAA-MM-DD), com saldo corrido
function extratoConta(txs, cfg, id, de, ate) {
  const ord = txs.map((t, i) => [t, i]).sort((a, b) => a[0].data.localeCompare(b[0].data) || a[1] - b[1]).map(x => x[0]);
  const c = ((cfg && cfg.contas) || []).find(x => x.id === id);
  let ini = c ? Number(c.saldo0) || 0 : 0, run = null, ent = 0, sai = 0; const linhas = [];
  for (const t of ord) {
    let d = 0; for (const [cid, v] of efeitos(t)) if (cid === id) d += v;
    if (!d) continue;
    if (t.data < de) { ini = r2(ini + d); continue; }
    if (run === null) run = ini;
    if (t.data > ate) break;
    run = r2(run + d); if (d > 0) ent += d; else sai -= d;
    linhas.push({ t, ent: d > 0 ? r2(d) : 0, sai: d < 0 ? r2(-d) : 0, saldo: run });
  }
  return { ini: r2(ini), ent: r2(ent), sai: r2(sai), fim: linhas.length ? linhas[linhas.length - 1].saldo : r2(ini), linhas };
}

// Extrato de receitas ou despesas por categoria no período, agrupado
function extratoCat(txs, kind, cat, de, ate) {
  const g = {};
  for (const t of txs) {
    if (t.tipo !== kind || t.data < de || t.data > ate) continue;
    const k = t.cat || (kind === 'receita' ? 'Sem categoria' : 'Outras despesas');
    if (cat && cat !== 'todas' && k !== cat) continue;
    (g[k] = g[k] || []).push(t);
  }
  const grupos = Object.keys(g).map(k => { const itens = g[k].sort((a, b) => a.data.localeCompare(b.data)); return { cat: k, itens, total: sumTx(itens, () => true) }; }).sort((a, b) => b.total - a.total);
  return { grupos, total: r2(grupos.reduce((s, x) => s + x.total, 0)) };
}

// Demonstrativo do ano, mês a mês
function dreAno(txs, ano, cfg) {
  const meses = [];

    if (!aba) throw new Error('A planilha não tem a aba "Lancamentos".');
    GS.sheetId = id; GS.gid = aba.properties.sheetId; lsSet('caixa-mei-sheet-id', id);
  },

  toRow(t) { return [t.id, t.data, t.tipo, Number(t.valor), t.fonte || '', t.cat || '', t.tipo === 'receita' ? (t.nf ? 'sim' : 'não') : '', t.comp || '', t.desc || '', new Date().toISOString(), t.conta || '', t.destino || '']; },
  fromRow(r, row, cfg) {
    const norm = x => String(x == null ? '' : x).normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().toLowerCase();
    const ALIAS = { transf: 'transf', transferencia: 'transf', 'transferencia entre contas': 'transf', receita: 'receita', despesa: 'despesa', aplicacao: 'aplicacao', resgate: 'resgate', rendimento: 'rendimento', 'rendimento liquido': 'rendimento', ret_isenta: 'ret_isenta', 'lucro isento': 'ret_isenta', ret_trib: 'ret_trib', 'lucro tributavel': 'ret_trib', aporte: 'aporte', 'aporte do titular': 'aporte' };
    const iso = d => {
      if (typeof d === 'number') return new Date(Math.round((d - 25569) * 86400000)).toISOString().slice(0, 10);
      const s = String(d || '').trim(), m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s);
      return m ? m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0') : s.slice(0, 10);
    };
    const tipo = ALIAS[norm(r[2])] || '';
    // conta: vazio = padrão; nome ou id conhecido = essa conta; qualquer outra coisa invalida a linha (não adivinha)
    const acc = x => { const q = slug(x); if (!q || q === 'ok' || q === 'conferir') return ''; const c = cfg.contas.find(a => a.id === q || slug(a.nome) === q); return c ? c.id : null; };
    const o = { id: r[0] ? String(r[0]) : 'linha' + row, data: iso(r[1]), tipo, valor: typeof r[3] === 'number' ? r[3] : parseNum(r[3]) };
    if (!tipo || !/^\d{4}-\d{2}-\d{2}$/.test(o.data) || !(o.valor > 0)) return null;
    const n4 = norm(r[4]);
    const fonte = n4 === 'com' || n4.startsWith('comun') ? 'com' : n4 === 'pat' || n4.startsWith('patin') || n4.startsWith('aulas') ? 'pat' : n4 === 'ger' || n4 === 'geral' ? 'ger' : '';
    if (tipo === 'receita') { if (!fonte || fonte === 'ger') return null; o.fonte = fonte; o.nf = ['sim', 's', 'yes', 'true', '1'].includes(norm(r[6])); }
    if (tipo === 'despesa') {
      o.fonte = fonte || 'ger';
      o.cat = cfg.catsDesp.find(c => norm(c) === norm(r[5])) || (r[5] ? String(r[5]).trim() : 'Outras despesas');
      let comp = typeof r[7] === 'number' ? iso(r[7]).slice(0, 7) : String(r[7] || '').trim(); const mc = /^(\d{1,2})\/(\d{4})$/.exec(comp);
      if (mc) comp = mc[2] + '-' + mc[1].padStart(2, '0');
      if (!/^\d{4}-\d{2}/.test(comp) && o.cat === 'DAS MEI') { const d = new Date(o.data + 'T12:00:00'); d.setMonth(d.getMonth() - 1); comp = d.toISOString().slice(0, 7); }
      if (/^\d{4}-\d{2}/.test(comp)) o.comp = comp.slice(0, 7);
    }
    if (tipo === 'receita' && r[5]) o.cat = cfg.catsRec.find(c => norm(c) === norm(r[5])) || String(r[5]).trim();
    const c1 = acc(r[10]), c2 = acc(r[11]);
    if (c1 === null) return null;
    if (c1) o.conta = c1;
    if (tipo === 'aplicacao' || tipo === 'resgate' || tipo === 'transf') {
      if (c2 === null) return null;
      if (c2) o.destino = c2;
      if (tipo === 'transf' && (!o.conta || !o.destino || o.conta === o.destino)) return null;
    }
    o.desc = String(r[8] || '');
    return o;
  },
  async loadAll() {
    const u = SH + '/' + GS.sheetId + '/values:batchGet?valueRenderOption=UNFORMATTED_VALUE&ranges=' + encodeURIComponent('Lancamentos!A2:L') + '&ranges=' + encodeURIComponent('Config!A1:B1');
    const r = await GS.api(u);
    const vr = r.valueRanges || [], rows = (vr[0] && vr[0].values) || [], c = vr[1] && vr[1].values && vr[1].values[0];
    let cfg = null; try { cfg = c && c[1] ? JSON.parse(c[1]) : null; } catch (e) { cfg = null; }
    const cfgN = mkCfg(cfg);
    GS.rows.clear(); GS.skipped = 0; GS.skippedRows = []; const tx = [], vistos = new Set();
    rows.forEach((row, i) => {
      if (!row || row.every(v => v === '' || v == null)) return;
      const t = GS.fromRow(row, i + 2, cfgN);
      if (t && !vistos.has(t.id)) { vistos.add(t.id); tx.push(t); GS.rows.set(t.id, i + 2); } else { GS.skipped++; GS.skippedRows.push(i + 2); }
    });
    GS.last = Date.now();
    return { tx, cfg };
  },
  async put(t) {
    const row = GS.rows.get(t.id);
    if (row) { await GS.api(SH + '/' + GS.sheetId + '/values/' + encodeURIComponent('Lancamentos!A' + row + ':L' + row) + '?valueInputOption=RAW', { method: 'PUT', body: JSON.stringify({ values: [GS.toRow(t)] }) }); return; }
    await GS.putMany([t]);
  },
  async putMany(list) {
    if (!list.length) return;
    const r = await GS.api(SH + '/' + GS.sheetId + '/values/' + encodeURIComponent('Lancamentos!A:L') + ':append?valueInputOption=RAW&insertDataOption=INSERT_ROWS', { method: 'POST', body: JSON.stringify({ values: list.map(GS.toRow) }) });
    const m = /!A(\d+):/.exec((r && r.updates && r.updates.updatedRange) || '');
    if (m) list.forEach((t, i) => GS.rows.set(t.id, Number(m[1]) + i));
  },
  async updateMany(list) {
    if (!list.length) return;
    await GS.api(SH + '/' + GS.sheetId + '/values:batchUpdate', { method: 'POST', body: JSON.stringify({ valueInputOption: 'RAW', data: list.map(t => { const row = GS.rows.get(t.id); return { range: 'Lancamentos!A' + row + ':L' + row, values: [GS.toRow(t)] }; }) }) });
  },
  async del(id) {
    const row = GS.rows.get(id); if (!row) return;
    await GS.api(SH + '/' + GS.sheetId + ':batchUpdate', { method: 'POST', body: JSON.stringify({ requests: [{ deleteDimension: { range: { sheetId: GS.gid, dimension: 'ROWS', startIndex: row - 1, endIndex: row } } }] }) });
    GS.rows.delete(id); for (const [k, v] of GS.rows) if (v > row) GS.rows.set(k, v - 1);
  },
  async putCfg() {
    await GS.api(SH + '/' + GS.sheetId + '/values/' + encodeURIComponent('Config!A1:B1') + '?valueInputOption=RAW', { method: 'PUT', body: JSON.stringify({ values: [['config_json', JSON.stringify(S.cfg)]] }) });
  }
};

function chartAno(serie) {
  const W = 600, H = 200, L = 44, B = 24, T = 10, R = 8;
  const max0 = Math.max(1000, ...serie.map(s => Math.max(s.receita, s.desp + s.das)));
  const step0 = max0 > 12000 ? 5000 : max0 > 6000 ? 2000 : max0 > 3000 ? 1000 : 500;
  const max = Math.ceil(max0 / step0) * step0;
  const y = v => T + (H - T - B) * (1 - v / max);
  const gw = (W - L - R) / 12, bw = gw * 0.34;
  let g = '';
  for (let v = 0; v <= max; v += step0) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${v >= 1000 ? (v / 1000) + 'k' : v}</text>`;
  serie.forEach((s, i) => {
    const x0 = L + i * gw + gw / 2;
    const d = s.desp + s.das;
    g += `<rect x="${x0 - bw - 1}" y="${y(s.receita)}" width="${bw}" height="${Math.max(0, y(0) - y(s.receita))}" rx="2" style="fill:var(--accent)"/>`;
    g += `<rect x="${x0 + 1}" y="${y(d)}" width="${bw}" height="${Math.max(0, y(0) - y(d))}" rx="2" style="fill:var(--neg)" opacity=".75"/>`;
    g += `<text x="${x0}" y="${H - 8}" text-anchor="middle" ${s.ym === S.ym ? 'style="font-weight:700;fill:var(--ink)"' : ''}>${MESES[i]}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Receitas e despesas por mês em ${S.ano}">${g}</svg>
  <div class="legend"><span><i class="dot" style="background:var(--accent)"></i>Receitas</span><span><i class="dot" style="background:var(--neg)"></i>Despesas e DAS</span></div>`;
}

function alertas(ap, lim, das) {
  const a = [];
  if (lim.nivel === 'critico') a.push(['bad', `Você passou de 120% do limite (${brl(lim.tolerancia)}). O desenquadramento vira retroativo. Fale com um contador agora.`]);
  else if (lim.nivel === 'excesso') a.push(['bad', `Faturamento acima do limite de ${brl(lim.limite)}. Dentro de 20% você continua MEI neste ano, paga DAS complementar sobre o excesso e migra para ME em janeiro.`]);
  else if (lim.nivel === 'atencao') a.push(['warn', `Você já usou ${pctf(lim.pct)} do limite anual. No ritmo atual, fecha o ano em ${brl(lim.projecao)}.`]);
  else if (lim.projecao > lim.limite) a.push(['warn', `Hoje você está dentro do limite, mas a projeção do ano é ${brl(lim.projecao)}, acima de ${brl(lim.limite)}.`]);
  const atras = das.filter(d => d.st === 'atrasado');
  if (atras.length) a.push(['bad', `DAS em atraso: ${atras.map(d => MESES[Number(d.comp.slice(5)) - 1]).join(', ')}. Multa de 0,33% ao dia (máximo 20%) mais juros.`]);
  if (ap.prejuizoYtd && S.tx.length) a.push(['warn', 'Não há lucro acumulado disponível para transferir. Retirar agora seria devolver capital, não distribuir lucro.']);
  if (ap.limitadoCaixa) a.push(['warn', 'A sugestão de transferência foi reduzida para manter o caixa mínimo na conta corrente.']);
  if (!a.length) a.push(['ok', 'Tudo em ordem: limite, DAS e caixa sem alertas neste momento.']);
  return `<div class="alerts">${a.map(([c, t]) => `<div class="alert ${c}">${esc(t)}</div>`).join('')}</div>`;
}

function viewApur() {
  const ap = apuracao(S.tx, S.ym, S.cfg);
  const m = ap.mes, c = S.cfg;
  const porFonte = c.fontes.map(f => {
    const rec = m.porFonte[f.id] || 0;
    const desp = sumTx(monthTx(S.tx, S.ym), t => t.tipo === 'despesa' && t.fonte === f.id && t.cat !== 'DAS MEI');
    return { f, rec, desp, res: r2(rec - desp) };
  });
  const geral = sumTx(monthTx(S.tx, S.ym), t => t.tipo === 'despesa' && t.fonte === 'ger' && t.cat !== 'DAS MEI');
  const falta = r2(ap.faltaIsento + ap.faltaTrib);
  const aviso = [];
  if (ap.limitadoTeto) aviso.push(`O plano de isento (${brl(ap.planejado)}) passaria do teto do ano. A sugestão foi limitada ao que ainda cabe.`);
  if (ap.limitadoCaixa) aviso.push(`Valor limitado para manter ${brl(c.caixaMin || 0)} de caixa mínimo nas contas e no dinheiro em espécie.`);
  if (ap.prejuizoYtd) aviso.push('Sem lucro acumulado disponível: nada a transferir.');
  return `
  <div class="card hi"><h2>Resultado de ${esc(ymLabel(S.ym))}</h2>
    <p class="small muted" style="margin-bottom:6px">Regime de caixa: conta o que entrou e saiu da conta corrente no mês.</p>
    <div class="steps">
      ${c.fontes.map(f => step(`<i class="dot" style="background:${f.cor}"></i>${esc(f.nome)}`, brl(m.porFonte[f.id] || 0))).join('')}
      ${step('Receitas totais', brl(m.receita), '', 'total')}
      ${step('(−) Despesas operacionais', sinal(-m.desp), 'neg')}
      ${step('(−) DAS pago no mês', sinal(-m.das), 'neg')}
      ${step('(+) Rendimento líquido das aplicações', brl(m.rend), 'pos')}
      ${step('Resultado do mês', brl(m.resultado), m.resultado < 0 ? 'neg' : 'pos', 'total')}
    </div></div>
  <div class="card hi"><h2>Quanto transferir para a conta pessoal</h2>
    <p class="small muted" style="margin-bottom:6px">Considera o lucro acumulado, o isento que sobrou de meses anteriores, o que você já transferiu e o dinheiro disponível.</p>
    <div class="steps">
      ${step('Lucro acumulado ainda na empresa', brl(ap.distribuivel))}
      ${step(`Plano: ${c.pctIsento}% do faturamento do mês`, brl(ap.planejadoMes))}
      ${ap.carry !== 0 ? step(ap.carry > 0 ? '(+) Isento de meses anteriores ainda não transferido' : '(−) Isento já adiantado em meses anteriores', sinal(ap.carry), ap.carry > 0 ? 'pos' : 'neg') : ''}
      ${ap.carry !== 0 ? step('Plano de isento deste mês', brl(ap.planejado), '', 'total') : ''}
      ${step(`Teto isento restante (${c.presuncao}% da receita do ano${c.descontaDas ? ', menos DAS' : ''}, menos o já transferido)`, brl(ap.folgaTeto))}
      ${step('Lucro isento sugerido', brl(ap.isento), 'pos', 'total')}
      ${step(ap.alvo > 0 ? `Lucro tributável sugerido (completa sua retirada de ${brl(ap.alvo)})` : `Lucro tributável sugerido (fica ${c.reservaCaixa}% na empresa)`, brl(ap.trib), '', 'total')}
      ${step('Caixa mínimo que fica (contas e espécie)', brl(c.caixaMin || 0))}
      ${step('Lucro que continua na empresa', brl(ap.retido))}
      ${step('Já transferido neste mês', brl(m.retiradas))}
      ${step('Falta transferir', brl(falta), falta > 0 ? 'warnc' : 'pos', 'total')}
    </div>
    ${aviso.map(a => `<div class="alert warn" style="margin-top:8px">${esc(a)}</div>`).join('')}
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
      <button class="btn sm" data-act="novo" data-tipo="ret_isenta" data-valor="${ap.faltaIsento}" ${ap.faltaIsento <= 0 ? 'disabled' : ''}>Registrar isento ${ap.faltaIsento > 0 ? brl(ap.faltaIsento) : ''}</button>
      <button class="btn sm alt" data-act="novo" data-tipo="ret_trib" data-valor="${ap.faltaTrib}" ${ap.faltaTrib <= 0 ? 'disabled' : ''}>Registrar tributável ${ap.faltaTrib > 0 ? brl(ap.faltaTrib) : ''}</button>
    </div>
    <p class="small" style="margin-top:10px">${ap.sustentavel > 0 ? `No ritmo do ano, dá para retirar cerca de <b class="num">${brl(ap.sustentavel)}</b> por mês, contando os meses sem renda. O lucro que fica na empresa cobre <b class="num">${ap.coberturaMeses.toLocaleString('pt-BR', { maximumFractionDigits: 1 })}</b> mês(es) de retirada.` : 'Ainda não há lucro acumulado para estimar a retirada sustentável.'}</p>
    <p class="small muted" style="margin-top:6px">${c.reservaIR > 0 ? `Separe cerca de <b class="num">${brl(ap.reservaIRvalor)}</b> (${c.reservaIR}% estimado) do tributável para o IRPF.` : 'O lucro tributável entra na sua declaração do IRPF como rendimento recebido da empresa. Sem outra renda, ele tende a ficar na faixa isenta, mas confirme com um contador.'}</p>
  </div>
  <div class="card"><h3>Qual atividade rende mais em ${esc(MESES_L[Number(S.ym.slice(5)) - 1].toLowerCase())}</h3>
    <div class="scroll"><table class="tbl"><thead><tr><th>Atividade</th><th class="r">Receita</th><th class="r">Despesa direta</th><th class="r">Sobra</th><th class="r">Margem</th></tr></thead><tbody>
      ${porFonte.map(x => `<tr><td><i class="dot" style="background:${x.f.cor}"></i>${esc(x.f.nome)}</td><td class="r">${brl(x.rec)}</td><td class="r">${brl(x.desp)}</td><td class="r ${x.res < 0 ? 'neg' : ''}">${brl(x.res)}</td><td class="r">${x.rec ? pctf(x.res / x.rec) : '–'}</td></tr>`).join('')}
      <tr class="sum"><td>Despesas gerais e DAS</td><td class="r"></td><td class="r">${brl(r2(geral + m.das))}</td><td class="r"></td><td class="r"></td></tr>
    </tbody></table></div></div>
  <div class="card flat"><details><summary>Como funciona e onde está o risco</summary>
    <div style="display:grid;gap:8px;margin-top:10px" class="small">
      <p><b>Isento tem teto.</b> Sem contabilidade formal, só é isento o lucro presumido de ${c.presuncao}% da receita de serviços${c.descontaDas ? ', menos o DAS pago' : ''}. O que passar disso é rendimento tributável na sua pessoa física. Com contador e escrituração regular, o lucro real apurado pode ser distribuído isento, o que muda o jogo se sua margem for maior que ${c.presuncao}%.</p>
      <p><b>O isento que ficou para trás volta.</b> Se em algum mês você transferiu menos que ${c.pctIsento}% do faturamento, a diferença entra na sugestão dos meses seguintes, sempre dentro do teto do ano. Em dezembro o teto zera para o ano seguinte, então o que não foi transferido até lá deixa de poder ser isento.</p>
      <p><b>Lucro é o que sobrou, não uma porcentagem fixa.</b> Transferir ${c.pctIsento}% do faturamento em mês fraco é tirar capital da empresa. Por isso a sugestão nunca passa do lucro acumulado nem do saldo da conta.</p>
      <p><b>Rendimento de aplicação não é faturamento.</b> Ele entra no resultado, mas fica fora do limite de ${brl(c.limite)} e da base do lucro presumido.</p>
      <p><b>Lucro guardado de anos anteriores</b> entra na conta e pode ser transferido. O teto do isento, porém, é calculado ano a ano. Se você já tinha lucro guardado antes de usar o app, informe em Ajustes.</p>
      <p>O app organiza e calcula. Não substitui orientação contábil nem a declaração do IRPF.</p>
    </div></details></div>`;
}
/* ===== Telas: obrigações e ajustes ===== */
const DAS_ST = { pago: ['ok', 'Pago'], atrasado: ['bad', 'Atrasado'], aberto: ['warn', 'Em aberto'], futuro: ['', 'Futuro'], antes: ['', 'Antes da abertura'] };

function rmrbCsv() {
  const linhas = [['Mês', 'Serviços com nota fiscal', 'Serviços sem nota fiscal', 'Total do mês']];
  for (let m = 1; m <= 12; m++) {
    const x = rmrb(S.tx, S.ano + '-' + String(m).padStart(2, '0'));
    linhas.push([MESES_L[m - 1], x.servicosComNF.toFixed(2).replace('.', ','), x.servicosSemNF.toFixed(2).replace('.', ','), x.total.toFixed(2).replace('.', ',')]);
  }
  return linhas.map(l => l.join(';')).join('\n');
}

function viewObrig() {
  const lim = limiteMei(S.tx, S.ano, S.cfg, hojeISO);
  const das = statusDas(S.tx, S.ano, S.cfg, hojeISO);
  const tAno = totals(S.tx.filter(t => yOf(t.data) === S.ano));
  const pctBar = Math.min(1, lim.receita / (lim.limite * 1.2));
  const cls = lim.nivel === 'ok' ? '' : lim.nivel === 'atencao' ? 'warn' : 'bad';
  const nivelTxt = { ok: ['ok', 'Dentro do limite'], atencao: ['warn', 'Perto do limite'], excesso: ['bad', 'Acima do limite'], critico: ['bad', 'Acima de 120%'] }[lim.nivel];
  const rows = [];
  for (let m = 1; m <= 12; m++) { const x = rmrb(S.tx, S.ano + '-' + String(m).padStart(2, '0')); rows.push(`<tr><td>${MESES_L[m - 1]}</td><td class="r">${brl(x.servicosComNF)}</td><td class="r">${brl(x.servicosSemNF)}</td><td class="r">${brl(x.total)}</td></tr>`); }
  return `
  <div class="card hi"><h2>Limite de faturamento ${S.ano}</h2>
    <div style="margin:8px 0 12px"><span class="pill ${nivelTxt[0]}">${nivelTxt[1]}</span></div>
    <div class="gauge"><i class="${cls}" style="width:${(pctBar * 100).toFixed(1)}%"></i><u style="left:${(100 / 1.2).toFixed(2)}%"></u></div>
    <div class="steps" style="margin-top:8px">
      ${step('Faturado no ano (sem rendimentos)', brl(lim.receita))}
      ${step(lim.meses < 12 ? `Limite proporcional (${lim.meses} meses)` : 'Limite anual', brl(lim.limite))}
      ${step('Tolerância de 20%', brl(lim.tolerancia))}
      ${step('Média mensal até agora', brl(lim.mediaMes))}
      ${step('Projeção para dezembro', brl(lim.projecao), lim.projecao > lim.limite ? 'warnc' : '')}
    </div>
    <p class="small muted" style="margin-top:8px">Até 20% acima do limite, você segue MEI no ano, paga DAS complementar sobre o excesso e vira ME em janeiro. Acima de 20%, o desenquadramento é retroativo ao mês do estouro. Existem projetos no Congresso para subir o teto, mas o valor em vigor continua sendo ${brl(S.cfg.limite)}.</p></div>
  <div class="card"><h2>DAS mensal</h2>
    <p class="small muted" style="margin-bottom:10px">Vence todo dia 20 do mês seguinte. Para constar aqui, registre o pagamento como despesa na categoria <b>DAS MEI</b>, informando a competência. Valor padrão: ${brl(S.cfg.das)}.</p>
    <div class="months">${das.map(d => { const [c, n] = DAS_ST[d.st]; return `<div class="mcell"><b>${MESES[Number(d.comp.slice(5)) - 1]}</b><span class="pill ${c}">${n}</span><span class="muted">vence ${fmtData(d.venc).slice(0, 5)}</span></div>`; }).join('')}</div></div>
  <div class="card"><h2>Declaração anual (DASN-SIMEI)</h2>
    <p>Faturamento de ${S.ano} para declarar: <b class="num">${brl(tAno.receita)}</b>, sendo ${brl(tAno.comNF)} com nota e ${brl(tAno.semNF)} sem nota. Prazo: <b>31/05/${S.ano + 1}</b>${`${S.ano + 1}-05-31` < hojeISO ? '. <b class="neg">O prazo já passou.</b> Se ainda não entregou, entregue o quanto antes: há multa por atraso, e ela cresce a cada mês' : ''}.</p>
    <p class="small muted" style="margin-top:6px">Rendimentos de aplicações não entram nesse valor.</p></div>
  <div class="card"><h2>Relatório mensal das receitas brutas</h2>
    <p class="small muted" style="margin-bottom:8px">Obrigatório para o MEI, com as notas fiscais arquivadas. Guarde uma cópia por mês.</p>
    <div class="scroll"><table class="tbl"><thead><tr><th>Mês</th><th class="r">Com nota</th><th class="r">Sem nota</th><th class="r">Total</th></tr></thead><tbody>${rows.join('')}
      <tr class="sum"><td>Total ${S.ano}</td><td class="r">${brl(tAno.comNF)}</td><td class="r">${brl(tAno.semNF)}</td><td class="r">${brl(tAno.receita)}</td></tr></tbody></table></div>
    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn sm" data-act="rmrbCsv">Baixar planilha (CSV)</button><button class="btn sm alt" data-act="rmrbCopy">Copiar texto</button></div>
    <p class="small muted" style="margin-top:10px">Cliente empresa (CNPJ) exige nota fiscal de serviço. Aula particular para pessoa física pode ficar sem nota, mas o valor continua entrando no faturamento.</p></div>`;
}

const fld = (id, label, val, attrs) => `<div class="field"><label for="${id}">${label}</label><input id="${id}" value="${esc(val)}" ${attrs || ''}></div>`;

function catBloco(kind, titulo, lista) {
  const uso = n => S.tx.filter(t => t.tipo === kind && (t.cat || (kind === 'receita' ? 'Sem categoria' : 'Outras despesas')) === n).length;
  const linhas = lista.map(n => {
    const fixa = n === 'DAS MEI', key = kind + '|' + n, ed = S.catEdit && S.catEdit.key === key, conf = S.catPend === key, u = uso(n);
    if (ed) return `<div class="step" style="align-items:center;gap:8px"><input id="cat_novo" value="${esc(n)}" style="flex:1;min-width:0;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:7px"><span><button class="link" data-act="catRenOk" data-kind="${kind}" data-nome="${esc(n)}">Salvar</button><button class="link" data-act="catRenCancel">Cancelar</button></span></div>`;
    return `<div class="step" style="align-items:center"><span>${esc(n)}${fixa ? ' <span class="pill">fixa</span>' : ''}${u ? ` <span class="small muted">${u} lanç.</span>` : ''}</span><span>${fixa ? '' : `<button class="link" data-act="catRen" data-kind="${kind}" data-nome="${esc(n)}">Renomear</button><button class="link danger" data-act="${conf ? 'catDelOk' : 'catDel'}" data-kind="${kind}" data-nome="${esc(n)}">${conf ? 'Confirmar' : 'Remover'}</button>`}</span></div>`;
  }).join('');
  return `<h3 style="margin-top:6px">${titulo}</h3><div class="steps" style="margin-bottom:8px">${linhas}</div>
    <div style="display:flex;gap:8px;margin-bottom:14px"><input id="catadd_${kind}" placeholder="Nova categoria de ${titulo.toLowerCase()}" style="flex:1;min-width:0;background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:10px"><button class="btn sm" data-act="catAdd" data-kind="${kind}">Adicionar</button></div>`;
}

const csvNum = n => (Number(n) || 0).toFixed(2).replace('.', ',');
const csvTxt = s => '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"';
const contaNome = id => contaNomeDe(S.cfg, id);
const contaUsada = id => S.tx.some(t => t.conta === id || t.destino === id);

/* ---------- Contas ---------- */
function dataConf() { return S.ym < hojeISO.slice(0, 7) ? S.ym + '-' + pad2(ultimoDia(S.ym)) : hojeISO; }

function viewContas() {
  const fimMes = S.ym + '-' + pad2(ultimoDia(S.ym));
  const bal = balances(S.tx.filter(t => t.data <= fimMes), S.cfg);
  const vis = S.cfg.contas.filter(c => c.ativa || bal.por[c.id]);
  const ativas = S.cfg.contas.filter(c => c.ativa);
  const saldos = vis.map(c => step(`${esc(c.nome)} <span class="pill" style="margin-left:4px">${esc(TIPOS_CONTA[c.tipo])}</span>${c.ativa ? '' : ' <span class="pill warn">arquivada</span>'}`, brl(bal.por[c.id] || 0), (bal.por[c.id] || 0) < 0 ? 'neg' : '')).join('');
  const gerir = S.cfg.contas.map(c => {
    const arq = !c.ativa, remov = c.id !== DEF_CC && c.id !== DEF_INV && !contaUsada(c.id);
    return `<div class="card flat" style="margin-bottom:8px">
      <div class="frow"><div class="field"><label for="ct_n_${esc(c.id)}">Nome</label><input id="ct_n_${esc(c.id)}" value="${esc(c.nome)}"></div>
        <div class="field"><label for="ct_s_${esc(c.id)}">Saldo inicial (R$)</label><input id="ct_s_${esc(c.id)}" inputmode="decimal" value="${String(c.saldo0 || 0).replace('.', ',')}"></div></div>
      <div style="display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap"><span class="pill">${esc(TIPOS_CONTA[c.tipo])}</span>${arq ? '<span class="pill warn">arquivada</span>' : ''}<span style="flex:1"></span>
        <button class="link" data-act="ctArq" data-id="${esc(c.id)}">${arq ? 'Reativar' : 'Arquivar'}</button>${remov ? `<button class="link danger" data-act="ctDel" data-id="${esc(c.id)}">Remover</button>` : ''}</div></div>`;
  }).join('');
  return `
  <div class="card hi"><h2>Contas em ${esc(ymLabel(S.ym))}</h2>
    <p class="small muted" style="margin-bottom:8px">Posição no fim do mês escolhido lá em cima. Disponível é o que está em conta corrente e em espécie. Aplicações ficam à parte.</p>
    <div class="steps">${saldos}
      ${step('Disponível (contas e espécie)', brl(bal.cc), '', 'total')}
      ${step('Aplicações', brl(bal.inv))}
      ${step('Total da empresa', brl(r2(bal.cc + bal.inv)), '', 'total')}</div></div>
  <div class="card"><h2>Conferir com o extrato e lançar rendimento</h2>
    <p class="small muted" style="margin-bottom:10px">Digite o saldo que o banco mostra em cada conta na data escolhida. Nas aplicações, use o saldo líquido, depois do imposto. Se o saldo do banco for maior que o do app, a diferença é o rendimento do período e você pode lançar com um toque.</p>
    <div style="display:grid;gap:10px">
      <div class="field"><label for="cf_data">Data do extrato</label><input id="cf_data" type="date" value="${dataConf()}"></div>
      ${ativas.map(c => `<div class="field"><label for="cfc_${esc(c.id)}">${esc(c.nome)}${c.tipo === 'aplicacao' ? ' (saldo líquido)' : ''}</label><input id="cfc_${esc(c.id)}" inputmode="decimal" placeholder="saldo no extrato, 0,00"></div>`).join('')}
      <div><button class="btn sm" data-act="conferir">Conferir</button></div>
    </div>
    <div id="cfRes"></div></div>
  <div class="card"><h2>Gerenciar contas</h2>
    <p class="small muted" style="margin-bottom:10px">Cadastre cada conta corrente, aplicação ou o dinheiro em espécie. O saldo inicial é o que a conta tinha antes do primeiro lançamento do app. Se a conta passou a existir depois, deixe zero e registre um aporte ou uma transferência entre contas na data certa, senão os meses anteriores ficam com saldo errado.</p>
    ${gerir}
    <div><button class="btn sm" data-act="ctSave">Salvar nomes e saldos</button></div>
    <h3 style="margin:16px 0 8px">Nova conta</h3>
    <div style="display:grid;gap:10px">
      <div class="frow"><div class="field"><label for="ct_new_n">Nome</label><input id="ct_new_n" placeholder="Ex.: Caixa em espécie, CDB do banco X"></div>
        <div class="field"><label for="ct_new_t">Tipo</label><select id="ct_new_t">${Object.keys(TIPOS_CONTA).map(k => `<option value="${k}">${TIPOS_CONTA[k]}</option>`).join('')}</select></div></div>
      <div class="field"><label for="ct_new_s">Saldo inicial (R$)</label><input id="ct_new_s" inputmode="decimal" value="0"></div>
      <div><button class="btn sm alt" data-act="ctAdd">Adicionar conta</button></div></div></div>`;
}

/* ---------- Relatórios ---------- */
const PERS = [['mes', 'Mês escolhido'], ['ano', 'Ano escolhido'], ['tudo', 'Desde o início'], ['custom', 'Personalizado']];
function periodo() {
  const r = S.rel;
  if (r.per === 'ano') return { de: S.ano + '-01-01', ate: S.ano + '-12-31', label: 'Ano de ' + S.ano };
  if (r.per === 'tudo') return { de: '0000-01-01', ate: '9999-12-31', label: 'Desde o início' };
  if (r.per === 'custom') { const de = r.de || S.ym + '-01', ate = r.ate || S.ym + '-' + pad2(ultimoDia(S.ym)); return { de, ate, label: fmtData(de) + ' a ' + fmtData(ate) }; }
  return { de: S.ym + '-01', ate: S.ym + '-' + pad2(ultimoDia(S.ym)), label: ymLabel(S.ym) };
}
const segRel = (name, opts, cur, field) => `<div class="seg" role="radiogroup">${opts.map(([k, n]) => `<label><input type="radio" name="${name}" value="${k}" data-rel="${field}" ${cur === k ? 'checked' : ''}><span>${n}</span></label>`).join('')}</div>`;
const perCtl = () => `<div class="field"><label for="rel_per">Período</label><select id="rel_per" data-rel="per">${PERS.map(([k, n]) => `<option value="${k}" ${S.rel.per === k ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
  ${S.rel.per === 'custom' ? `<div class="frow"><div class="field"><label for="rel_de">De</label><input id="rel_de" type="date" data-rel="de" value="${esc(periodo().de)}"></div><div class="field"><label for="rel_ate">Até</label><input id="rel_ate" type="date" data-rel="ate" value="${esc(periodo().ate)}"></div></div>` : ''}`;
const acoesRel = () => `<div class="noprint" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn sm" data-act="relCsv">Baixar planilha (CSV)</button><button class="btn sm alt" data-act="relPrint">Imprimir ou salvar em PDF</button></div>`;
const cabImpr = titulo => `<div class="printonly" style="margin-bottom:10px"><h2>${esc(S.cfg.nome)}</h2><p>${esc(titulo)}</p></div>`;

function viewRel() {
  const sub = S.rel.sub;
  return `<div class="card noprint"><div class="seg" role="radiogroup" aria-label="Tipo de relatório">${[['dre', 'Resultado do ano'], ['conta', 'Extrato de conta'], ['cat', 'Receitas e despesas']].map(([k, n]) => `<label><input type="radio" name="relsub" value="${k}" data-rel="sub" ${sub === k ? 'checked' : ''}><span>${n}</span></label>`).join('')}</div></div>`
    + (sub === 'conta' ? viewExtConta() : sub === 'cat' ? viewExtCat() : viewDre());
}

/* Demonstrativo anual: uma coluna por mês */
function dreRows() {
  const meses = dreAno(S.tx, S.ano, S.cfg), hojeAno = Number(hojeISO.slice(0, 4));
  const idxFim = S.ano < hojeAno ? 11 : S.ano === hojeAno ? Number(hojeISO.slice(5, 7)) - 1 : -1;
  const soma = a => r2(a.reduce((x, y) => x + y, 0));
  const rows = [];
  const sec = t => rows.push({ sec: t });
  const add = (label, vals, o) => rows.push({ label, vals, total: soma(vals), ...(o || {}) });
  const pos = (label, vals, o) => rows.push({ label, vals: vals.map((v, i) => i > idxFim ? null : v), total: idxFim >= 0 ? vals[idxFim] : null, ...(o || {}) });
  const ordem = (usadas, lista) => [...lista.filter(k => usadas.has(k)), ...[...usadas].filter(k => !lista.includes(k))];
  sec('Receitas');
  if (S.rel.recBy === 'cat') {
    const us = new Set(); meses.forEach(m => Object.keys(m.catRec).forEach(k => us.add(k)));
    ordem(us, S.cfg.catsRec).forEach(k => add(k, meses.map(m => m.catRec[k] || 0), { ind: true }));
  } else S.cfg.fontes.forEach(f => add(f.nome, meses.map(m => m.porFonte[f.id] || 0), { ind: true, cor: f.cor }));
  add('Receitas totais', meses.map(m => m.receita), { bold: true });
  sec('Despesas');
  const ud = new Set(); meses.forEach(m => Object.keys(m.catDesp).forEach(k => ud.add(k)));
  ordem(ud, S.cfg.catsDesp).forEach(k => add(k, meses.map(m => m.catDesp[k] || 0), { ind: true }));
  add('Despesas operacionais', meses.map(m => m.desp), { bold: true });
  add('DAS pago', meses.map(m => m.das), { bold: true });
  sec('Resultado');
  add('Rendimento líquido das aplicações', meses.map(m => m.rend));
  add('Resultado do mês', meses.map(m => m.resultado), { bold: true, res: true });
  const rec = soma(meses.map(m => m.receita)), res = soma(meses.map(m => m.resultado));
  rows.push({ label: 'Margem sobre a receita', vals: meses.map(m => m.receita ? m.resultado / m.receita : null), total: rec ? res / rec : null, pct: true });
  sec('Transferências para a conta pessoal');
  add('Lucro isento', meses.map(m => m.retIsenta));
  add('Lucro tributável', meses.map(m => m.retTrib));
  add('Total transferido', meses.map(m => m.retiradas), { bold: true });
  sec('Posição no fim do mês');
  pos('Disponível (contas e espécie)', meses.map(m => m.disp));
  pos('Aplicações', meses.map(m => m.inv));
  pos('Lucro acumulado na empresa', meses.map(m => m.retido), { bold: true });
  return { meses, rows, idxFim };
}

function viewDre() {
  const { rows } = dreRows();
  const cel = (v, r) => v == null ? '–' : r.pct ? pctf(v) : (v ? numBr(v) : '–');
  const corpo = rows.map(r => {
    if (r.sec) return `<tr class="secrow"><td colspan="14">${esc(r.sec)}</td></tr>`;
    const cls = x => `r${r.res && x != null && x < 0 ? ' neg' : ''}`;
    return `<tr class="${r.bold ? 'sum' : ''}"><td${r.ind ? ' style="padding-left:16px"' : ''}>${r.cor ? `<i class="dot" style="background:${r.cor}"></i>` : ''}${esc(r.label)}</td>${r.vals.map((v, i) => `<td class="${cls(v)}${S.ym === S.ano + '-' + pad2(i + 1) ? ' cur' : ''}">${cel(v, r)}</td>`).join('')}<td class="${cls(r.total)} tot">${cel(r.total, r)}</td></tr>`;
  }).join('');
  return `<div class="card">${cabImpr('Resultado de ' + S.ano + ', mês a mês (regime de caixa)')}
    <h2>Resultado de ${S.ano}, mês a mês</h2>
    <p class="small muted noprint" style="margin:4px 0 10px">Valores em reais. Despesas e DAS aparecem como positivos e já estão descontados do resultado. Na parte de posição, a coluna Total mostra o último mês realizado.</p>
    <div class="noprint" style="margin-bottom:10px"><span class="small muted">Receitas por:</span> ${segRel('recby', [['ativ', 'Atividade'], ['cat', 'Categoria']], S.rel.recBy, 'recBy')}</div>
    <div class="scroll"><table class="tbl dre"><thead><tr><th></th>${MESES.map((m, i) => `<th class="r${S.ym === S.ano + '-' + pad2(i + 1) ? ' cur' : ''}">${m}</th>`).join('')}<th class="r">Total</th></tr></thead><tbody>${corpo}</tbody></table></div>
    ${acoesRel()}</div>`;
}
function dreCsv() {
  const { rows } = dreRows();
  const l = [['Demonstrativo ' + S.ano, ...MESES.map(m => m), 'Total'].join(';')];
  rows.forEach(r => { if (r.sec) l.push(csvTxt(r.sec)); else l.push([csvTxt(r.label), ...r.vals.map(v => v == null ? '' : r.pct ? csvNum(v * 100) + '%' : csvNum(v)), r.total == null ? '' : r.pct ? csvNum(r.total * 100) + '%' : csvNum(r.total)].join(';')); });
  return l.join('\n');
}

/* Extrato de conta */
function histTx(t, id) {
  const k = TIPOS[t.tipo].nome, extra = t.desc ? ' · ' + t.desc : '';
  if (MOVE.includes(t.tipo)) { const [[o], [d]] = efeitos(t); return (o === id ? k + ' para ' + contaNome(d) : k + ' de ' + contaNome(o)) + extra; }
  return (t.desc || k) + (t.cat ? ' · ' + t.cat : '');
}
function viewExtConta() {
  const r = S.rel, per = periodo();
  const id = S.cfg.contas.some(c => c.id === r.conta) ? r.conta : DEF_CC;
  const ex = extratoConta(S.tx, S.cfg, id, per.de, per.ate);
  const linhas = ex.linhas.map(l => `<tr><td>${fmtData(l.t.data)}</td><td style="min-width:180px;white-space:normal">${esc(histTx(l.t, id))}</td><td class="r pos">${l.ent ? numBr(l.ent) : ''}</td><td class="r neg">${l.sai ? numBr(l.sai) : ''}</td><td class="r">${numBr(l.saldo)}</td></tr>`).join('');
  return `<div class="card">${cabImpr('Extrato de ' + contaNome(id) + ' · ' + per.label)}
    <h2>Extrato de conta</h2>
    <div class="noprint" style="display:grid;gap:10px;margin:10px 0">
      <div class="field"><label for="rel_conta">Conta</label><select id="rel_conta" data-rel="conta">${S.cfg.contas.map(c => `<option value="${esc(c.id)}" ${c.id === id ? 'selected' : ''}>${esc(c.nome)}${c.ativa ? '' : ' (arquivada)'}</option>`).join('')}</select></div>
      ${perCtl()}</div>
    <p class="small muted printonly">${esc(contaNome(id))} · ${esc(per.label)}</p>
    <div class="grid3" style="margin-bottom:10px">
      <div class="kpi"><span class="eyebrow">Saldo inicial</span><span class="v">${brl(ex.ini)}</span></div>
      <div class="kpi"><span class="eyebrow">Entradas</span><span class="v pos">${brl(ex.ent)}</span></div>
      <div class="kpi"><span class="eyebrow">Saídas</span><span class="v neg">${brl(ex.sai)}</span></div>
      <div class="kpi"><span class="eyebrow">Saldo final</span><span class="v">${brl(ex.fim)}</span></div></div>
    <div class="scroll"><table class="tbl"><thead><tr><th>Data</th><th>Histórico</th><th class="r">Entrada</th><th class="r">Saída</th><th class="r">Saldo</th></tr></thead><tbody>
      <tr><td></td><td><i>Saldo inicial</i></td><td></td><td></td><td class="r">${numBr(ex.ini)}</td></tr>
      ${linhas || '<tr><td colspan="5" class="muted">Nenhuma movimentação neste período.</td></tr>'}
      <tr class="sum"><td></td><td>Saldo final</td><td class="r">${numBr(ex.ent)}</td><td class="r">${numBr(ex.sai)}</td><td class="r">${numBr(ex.fim)}</td></tr></tbody></table></div>
    ${acoesRel()}</div>`;
}
function extContaCsv() {
  const r = S.rel, per = periodo(), id = S.cfg.contas.some(c => c.id === r.conta) ? r.conta : DEF_CC;
  const ex = extratoConta(S.tx, S.cfg, id, per.de, per.ate);
  return ['Data;Histórico;Entrada;Saída;Saldo', ';Saldo inicial;;;' + csvNum(ex.ini)].concat(ex.linhas.map(l => [l.t.data, csvTxt(histTx(l.t, id)), l.ent ? csvNum(l.ent) : '', l.sai ? csvNum(l.sai) : '', csvNum(l.saldo)].join(';'))).concat([';Saldo final;' + csvNum(ex.ent) + ';' + csvNum(ex.sai) + ';' + csvNum(ex.fim)]).join('\n');
}

/* Extrato por categoria (receitas ou despesas) */
function viewExtCat() {
  const r = S.rel, per = periodo(), kind = r.kind;
  const lista = kind === 'receita' ? S.cfg.catsRec : S.cfg.catsDesp;
  const usadas = [...new Set(S.tx.filter(t => t.tipo === kind).map(t => t.cat || (kind === 'receita' ? 'Sem categoria' : 'Outras despesas')))];
  const todas = [...lista, ...usadas.filter(k => !lista.includes(k))];
  const cat = r.cat === 'todas' || todas.includes(r.cat) ? r.cat : 'todas';
  const ec = extratoCat(S.tx, kind, cat, per.de, per.ate);
  const corpo = ec.grupos.map(g => `<tr class="secrow"><td colspan="4">${esc(g.cat)}</td><td class="r">${numBr(g.total)}</td></tr>` + g.itens.map(t => `<tr><td>${fmtData(t.data)}</td><td style="min-width:160px;white-space:normal">${esc(t.desc || TIPOS[t.tipo].nome)}</td><td>${t.fonte && t.fonte !== 'ger' ? esc(fonteNome(t.fonte)) : ''}</td><td>${esc(contaNome(efeitos(t)[0][0]))}</td><td class="r">${numBr(t.valor)}</td></tr>`).join('')).join('');
  const nome = kind === 'receita' ? 'Receitas' : 'Despesas';
  return `<div class="card">${cabImpr(nome + (cat === 'todas' ? '' : ' · ' + cat) + ' · ' + per.label)}
    <h2>${nome} por categoria</h2>
    <div class="noprint" style="display:grid;gap:10px;margin:10px 0">
      ${segRel('relkind', [['despesa', 'Despesas'], ['receita', 'Receitas']], kind, 'kind')}
      <div class="field"><label for="rel_cat">Categoria</label><select id="rel_cat" data-rel="cat"><option value="todas">Todas</option>${todas.map(k => `<option ${k === cat ? 'selected' : ''}>${esc(k)}</option>`).join('')}</select></div>
      ${perCtl()}</div>
    <div class="scroll"><table class="tbl"><thead><tr><th>Data</th><th>Descrição</th><th>Atividade</th><th>Conta</th><th class="r">Valor</th></tr></thead><tbody>
      ${corpo || '<tr><td colspan="5" class="muted">Nenhum lançamento neste período.</td></tr>'}
      <tr class="sum"><td colspan="4">Total de ${nome.toLowerCase()}</td><td class="r">${numBr(ec.total)}</td></tr></tbody></table></div>
    ${acoesRel()}</div>`;
}
function extCatCsv() {
  const r = S.rel, per = periodo(), ec = extratoCat(S.tx, r.kind, r.cat, per.de, per.ate);
  const l = ['Categoria;Data;Descrição;Atividade;Conta;Valor'];
  ec.grupos.forEach(g => g.itens.forEach(t => l.push([csvTxt(g.cat), t.data, csvTxt(t.desc || ''), csvTxt(t.fonte && t.fonte !== 'ger' ? fonteNome(t.fonte) : ''), csvTxt(contaNome(efeitos(t)[0][0])), csvNum(t.valor)].join(';'))));
  l.push(';;;;Total;' + csvNum(ec.total));
  return l.join('\n');
}
const relCsv = () => S.rel.sub === 'conta' ? extContaCsv() : S.rel.sub === 'cat' ? extCatCsv() : dreCsv();
const relNomeArq = () => S.rel.sub === 'conta' ? 'extrato-' + slug(contaNome(S.rel.conta)) + '.csv' : S.rel.sub === 'cat' ? (S.rel.kind === 'receita' ? 'receitas' : 'despesas') + '-por-categoria.csv' : 'resultado-' + S.ano + '.csv';
/* ===== Interações e inicialização ===== */

  aplicacao: 'Sai de uma conta e vai para uma aplicação. Não é despesa.',

};
const parseNum = s => { s = String(s).trim().replace(/[R$\s]/g, ''); if (s.includes(',') || /^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '').replace(',', '.'); const n = Number(s); return isFinite(n) ? n : NaN; };
let toastT = null;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2800); }
function closeSheet() { $('#sheetbg').hidden = true; $('#sheetbg').innerHTML = ''; }
function openSheet(html) { const b = $('#sheetbg'); b.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`; b.hidden = false; const f = b.querySelector('input,select,button'); if (f) f.focus(); }
