}

const ROLE = { receita: ['disp', 'Entrou na conta'], aporte: ['disp', 'Entrou na conta'], despesa: ['disp', 'Saiu da conta'], ret_isenta: ['disp', 'Saiu da conta'], ret_trib: ['disp', 'Saiu da conta'], rendimento: ['inv', 'Aplicação'], aplicacao: ['disp', 'Origem', 'inv'], resgate: ['inv', 'Origem', 'disp'], transf: ['todas', 'Origem', 'todas'] };
const contasPara = (papel, atual) => S.cfg.contas.filter(c => (papel === 'inv' ? c.tipo === 'aplicacao' : papel === 'disp' ? c.tipo !== 'aplicacao' : true) && (c.ativa || c.id === atual));

function openForm(t) {
  if (S.example) { openStart(); return; }
  const edit = t && t.id;
  const d = { tipo: 'receita', data: hojeISO, valor: '', desc: '', fonte: 'com', cat: '', nf: true, comp: '', conta: '', destino: '', ...(t || {}) };
  const ef0 = edit ? efeitos(d) : [];
  const pConta = d.conta || (ef0[0] ? ef0[0][0] : ''), pDest = d.destino || (ef0[1] ? ef0[1][0] : '');
  const grupos = [['Entradas', ['receita', 'aporte']], ['Saídas', ['despesa']], ['Entre contas', ['aplicacao', 'resgate', 'transf']], ['Para você', ['ret_isenta', 'ret_trib']], ['Aplicações', ['rendimento']]];
  openSheet(`<h2>${edit ? 'Editar lançamento' : 'Novo lançamento'}</h2>
    <form id="fTx" style="display:grid;gap:12px" novalidate>
      <div class="field"><label for="f_tipo">Tipo</label><select id="f_tipo">${grupos.map(([g, ks]) => `<optgroup label="${g}">${ks.map(k => `<option value="${k}" ${d.tipo === k ? 'selected' : ''}>${TIPOS[k].nome}</option>`).join('')}</optgroup>`).join('')}</select><span class="small muted" id="f_hint"></span></div>
      <div class="frow"><div class="field"><label for="f_valor">Valor (R$)</label><input id="f_valor" inputmode="decimal" placeholder="0,00" value="${d.valor === '' ? '' : String(d.valor).replace('.', ',')}"></div>
        <div class="field"><label for="f_data">Data</label><input id="f_data" type="date" value="${esc(d.data)}"></div></div>
      <div class="frow"><div class="field" id="g_conta"><label for="f_conta" id="l_conta">Conta</label><select id="f_conta"></select></div>
        <div class="field" id="g_dest"><label for="f_dest">Destino</label><select id="f_dest"></select></div></div>
      <div class="field" id="g_fonte"><span class="l">Atividade</span><div class="seg" id="f_fonte">${[...S.cfg.fontes, { id: 'ger', nome: 'Geral' }].map(f => `<label data-f="${f.id}"><input type="radio" name="fonte" value="${f.id}" ${d.fonte === f.id ? 'checked' : ''}><span>${esc(f.nome)}</span></label>`).join('')}</div></div>
      <div class="field" id="g_cat"><label for="f_cat">Categoria</label><select id="f_cat"></select></div>
      <div class="field" id="g_comp"><label for="f_comp">Competência do DAS</label><input id="f_comp" type="month" value="${esc(d.comp)}"></div>
      <label class="check" id="g_nf"><input type="checkbox" id="f_nf" ${d.nf ? 'checked' : ''}> Com nota fiscal emitida</label>
      <div class="field"><label for="f_desc">Descrição ou cliente</label><input id="f_desc" value="${esc(d.desc)}" placeholder="Ex.: Mensalidades da turma, Cliente A"></div>
      <p class="small neg" id="f_err" role="alert" hidden></p>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" type="submit">Salvar</button><button class="btn alt" type="button" data-act="close">Cancelar</button></div>
    </form>`);
  const fill = (sel, papel, prefer) => {
    const cur = prefer || sel.value, lista = contasPara(papel, cur);
    sel.innerHTML = lista.map(c => `<option value="${esc(c.id)}">${esc(c.nome)}${c.ativa ? '' : ' (arquivada)'}</option>`).join('');
    if (lista.some(c => c.id === cur)) sel.value = cur;
  };
  const fillCat = (tp, prefer) => {
    const sel = $('#f_cat'), base = tp === 'receita' ? S.cfg.catsRec : S.cfg.catsDesp;
    const ops = (tp === 'receita' ? [''] : []).concat(base, prefer && !base.includes(prefer) ? [prefer] : []);
    sel.innerHTML = ops.map(k => `<option value="${esc(k)}">${k === '' ? '(sem categoria)' : esc(k)}</option>`).join('');
    sel.value = prefer !== null && ops.includes(prefer) ? prefer : (tp === 'receita' ? (base[0] || '') : (base.find(k => k !== 'DAS MEI') || base[0]));
  };
  let primeira = true;
  const sync = () => {
    const tp = $('#f_tipo').value, rl = ROLE[tp];
    $('#f_hint').textContent = HINTS[tp];
    $('#g_fonte').hidden = !(tp === 'receita' || tp === 'despesa');
    $('#g_cat').hidden = !(tp === 'despesa' || tp === 'receita');
    $('#g_nf').hidden = tp !== 'receita';
    $('#g_dest').hidden = !rl[2];
    $('#l_conta').textContent = rl[1];
    fill($('#f_conta'), rl[0], primeira ? pConta : '');
    if (rl[2]) fill($('#f_dest'), rl[2], primeira ? pDest : '');
    if (tp === 'receita' || tp === 'despesa') fillCat(tp, primeira && edit ? (d.cat || '') : null);
    $('#g_comp').hidden = !(tp === 'despesa' && $('#f_cat').value === 'DAS MEI');
    document.querySelectorAll('#f_fonte label').forEach(l => { l.hidden = tp === 'receita' && l.dataset.f === 'ger'; });
    if (tp === 'receita' && document.querySelector('input[name=fonte]:checked')?.value === 'ger') document.querySelector('input[name=fonte][value=com]').checked = true;
    if (tp === 'despesa' && $('#f_cat').value === 'DAS MEI' && !$('#f_valor').value) $('#f_valor').value = String(S.cfg.das).replace('.', ',');
    primeira = false;
  };
  $('#f_tipo').addEventListener('change', sync);
  $('#f_cat').addEventListener('change', () => { const tp = $('#f_tipo').value; $('#g_comp').hidden = !(tp === 'despesa' && $('#f_cat').value === 'DAS MEI'); if (!$('#g_comp').hidden && !$('#f_valor').value) $('#f_valor').value = String(S.cfg.das).replace('.', ','); });
  sync();
  $('#fTx').addEventListener('submit', async e => {
    e.preventDefault();
    const tipo = $('#f_tipo').value, valor = parseNum($('#f_valor').value), data = $('#f_data').value, rl = ROLE[tipo];
    const err = m => { const p = $('#f_err'); p.textContent = m; p.hidden = false; };
    if (!(valor > 0)) return err('Informe um valor maior que zero.');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(data)) return err('Informe a data do lançamento.');
    const conta = $('#f_conta').value, destino = rl[2] ? $('#f_dest').value : '';
    if (!conta) return err(rl[0] === 'inv' ? 'Cadastre uma conta do tipo aplicação na aba Contas.' : 'Escolha a conta.');
    if (rl[2] && !destino) return err('Escolha a conta de destino. Se ela não existe, cadastre na aba Contas.');
    if (rl[2] && conta === destino) return err('Origem e destino precisam ser contas diferentes.');
    const o = { id: edit ? t.id : newId(), tipo, data, valor: r2(valor), desc: $('#f_desc').value.trim(), conta };
    if (rl[2]) o.destino = destino;
    if (tipo === 'receita' || tipo === 'despesa') o.fonte = document.querySelector('input[name=fonte]:checked')?.value || 'com';
    if (tipo === 'receita') { o.nf = $('#f_nf').checked; if ($('#f_cat').value) o.cat = $('#f_cat').value; }
    if (tipo === 'despesa') { o.cat = $('#f_cat').value; if (o.cat === 'DAS MEI') { o.comp = $('#f_comp').value; if (!o.comp) return err('Informe a competência do DAS (o mês a que ele se refere).'); } }
    try { await Store.saveTx(o); } catch (x) { return err('Não foi possível salvar agora. Tente de novo.'); }
    S.ano = yOf(data); S.ym = ymOf(data); closeSheet(); render(); toast(edit ? 'Lançamento atualizado' : 'Lançamento salvo');
  });
}

async function saveFile(filename, data, label) {
  let dl = null; try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
  if (!dl) {
    if (window.claude) { toast('Baixar arquivo não está disponível nesta tela.'); return; }
    try { const bl = new Blob([filename.endsWith('.csv') ? '\ufeff' + data : data], { type: 'text/plain;charset=utf-8' }); const u = URL.createObjectURL(bl); const an = document.createElement('a'); an.href = u; an.download = filename; document.body.appendChild(an); an.click(); an.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000); toast(label + ' salvo'); } catch (x) { toast('Não foi possível salvar o arquivo.'); }
    return;
  }
  try { await dl.save({ filename, data }); toast(label + ' salvo'); } catch (e) { if (e && e.code !== 'declined') toast('Não foi possível salvar o arquivo.'); }
}
const txCsv = () => ['Data;Tipo;Atividade;Categoria;Valor;Nota fiscal;Competência DAS;Conta;Conta destino;Descrição'].concat([...S.tx].sort((a, b) => a.data.localeCompare(b.data)).map(t => [t.data, TIPOS[t.tipo].nome, t.fonte ? fonteNome(t.fonte) : '', t.cat || '', Number(t.valor).toFixed(2).replace('.', ','), t.tipo === 'receita' ? (t.nf ? 'sim' : 'não') : '', t.comp || '', contaNome(efeitos(t)[0][0]), efeitos(t)[1] ? contaNome(efeitos(t)[1][0]) : '', '"' + String(t.desc || '').replace(/"/g, '""') + '"'].join(';'))).join('\n');

async function acaoConta(a, el) {
  const salvar = async ok => { try { await Store.saveCfg(); render(); if (ok) toast(ok); } catch (x) { toast('Não foi possível salvar agora.'); } };
  const cs = S.cfg.contas;
  if (a === 'ctSave') {
    for (const c of cs) {
      const nome = ($('#ct_n_' + c.id) || {}).value, s0 = parseNum(($('#ct_s_' + c.id) || {}).value || '0');
      if (!nome || !nome.trim() || !isFinite(s0)) { toast('Confira o nome e o saldo de ' + c.nome + '.'); return; }
      if (cs.some(o => o !== c && slug(o.nome) === slug(nome))) { toast('Já existe outra conta chamada ' + nome.trim() + '.'); return; }
    }
    for (const c of cs) { c.nome = $('#ct_n_' + c.id).value.trim(); c.saldo0 = r2(parseNum($('#ct_s_' + c.id).value || '0')); }
    await salvar('Contas salvas');
  } else if (a === 'ctAdd') {
    const nome = $('#ct_new_n').value.trim(), tipo = $('#ct_new_t').value, s0 = parseNum($('#ct_new_s').value || '0');
    if (!nome) { toast('Dê um nome para a conta.'); return; }
    if (!isFinite(s0)) { toast('Saldo inicial inválido.'); return; }
    if (cs.some(o => slug(o.nome) === slug(nome))) { toast('Já existe uma conta com esse nome.'); return; }
    let id = slug(nome) || 'conta', k = 2; while (cs.some(o => o.id === id)) id = slug(nome) + '-' + k++;
    cs.push({ id, nome, tipo, saldo0: r2(s0), ativa: true });
    await salvar('Conta adicionada');
  } else if (a === 'ctArq') {
    const c = cs.find(x => x.id === el.dataset.id); if (!c) return;
    if (c.ativa) {
      const saldo = balances(S.tx, S.cfg).por[c.id] || 0;
      if (Math.abs(saldo) >= 0.005) { toast('Só dá para arquivar conta com saldo zero. Transfira o saldo para outra conta antes.'); return; }
      if (c.tipo !== 'aplicacao' && cs.filter(x => x.ativa && x.tipo !== 'aplicacao').length <= 1) { toast('Precisa existir pelo menos uma conta corrente ou caixa ativo.'); return; }
    }
    c.ativa = !c.ativa; await salvar(c.ativa ? 'Conta reativada' : 'Conta arquivada');
  } else if (a === 'ctDel') {
    const c = cs.find(x => x.id === el.dataset.id); if (!c || c.id === DEF_CC || c.id === DEF_INV || contaUsada(c.id)) { toast('Essa conta tem lançamentos. Arquive em vez de remover.'); return; }
    S.cfg.contas = cs.filter(x => x.id !== c.id); await salvar('Conta removida');
  }
}
async function acaoCat(a, el) {
  const kind = el.dataset.kind, nome = el.dataset.nome, key = kind + '|' + nome;
  const campo = kind === 'receita' ? 'catsRec' : 'catsDesp', lista = S.cfg[campo];
  const salvar = async ok => { try { await Store.saveCfg(); render(); if (ok) toast(ok); } catch (x) { toast('Não foi possível salvar agora.'); } };
  if (a === 'catAdd') {
    const n = ($('#catadd_' + kind).value || '').trim();
    if (!n) { toast('Digite o nome da categoria.'); return; }
    if (lista.some(x => slug(x) === slug(n))) { toast('Essa categoria já existe.'); return; }
    lista.push(n); await salvar('Categoria adicionada');
  } else if (a === 'catDel') { S.catPend = key; render(); }
  else if (a === 'catDelOk') {
    if (nome === 'DAS MEI') return;
    S.cfg[campo] = lista.filter(x => x !== nome); S.catPend = null; await salvar('Categoria removida da lista');
  } else if (a === 'catRen') { S.catEdit = { key }; render(); const i = $('#cat_novo'); if (i) { i.focus(); i.select(); } }
  else if (a === 'catRenCancel') { S.catEdit = null; render(); }
  else if (a === 'catRenOk') {
    const novo = ($('#cat_novo').value || '').trim(); S.catEdit = null;
    if (!novo || novo === nome || nome === 'DAS MEI') { render(); return; }
    const mudou = S.tx.filter(t => t.tipo === kind && t.cat === nome).map(t => ({ ...t, cat: novo }));
    const dup = lista.some(x => x !== nome && slug(x) === slug(novo));
    S.cfg[campo] = dup ? lista.filter(x => x !== nome) : lista.map(x => x === nome ? novo : x);
    try { if (mudou.length) await Store.saveMany(mudou); await Store.saveCfg(); render(); toast(mudou.length ? 'Categoria renomeada em ' + mudou.length + ' lançamento(s)' : 'Categoria renomeada'); } catch (x) { toast('Não foi possível salvar agora.'); render(); }
  }
}

function readNum(id, min, max) { const n = parseNum($(id).value); return isFinite(n) ? Math.min(max, Math.max(min, n)) : null; }

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  if (a === 'tab') { S.tab = el.dataset.v; delPend = null; render(); window.scrollTo(0, 0); }
  else if (a === 'novo') {
    const o = { tipo: el.dataset.tipo || 'receita', valor: el.dataset.valor ? Number(el.dataset.valor) : '', desc: el.dataset.tipo && el.dataset.tipo.startsWith('ret') ? 'Transferência para conta pessoal' : el.dataset.tipo === 'rendimento' ? 'Rendimento líquido' : '' };
    if (el.dataset.conta) o.conta = el.dataset.conta;
    if (el.dataset.data) o.data = el.dataset.data;
    openForm(o);
  }
  else if (a === 'edit') openForm(S.tx.find(t => t.id === el.dataset.id));
  else if (a === 'del') { delPend = el.dataset.id; render(); }
  else if (a === 'delok') { try { await Store.delTx(el.dataset.id); toast('Lançamento excluído'); } catch (x) { toast('Não foi possível excluir agora.'); } delPend = null; render(); }
  else if (a === 'close') closeSheet();
  else if (a === 'start') openStart();
  else if (a === 'startok') { try { await Store.start(); } catch (x) { toast('Não foi possível iniciar agora.'); } closeSheet(); render(); toast('Caixa vazio. Pode lançar.'); }
  else if (a === 'saveCfg') {
    const c = S.cfg, nome = $('#c_nome').value.trim();
    const das = readNum('#c_das', 0, 1000), lim = readNum('#c_limite', 1000, 10000000), pct = readNum('#c_pct', 0, 100), pres = readNum('#c_pres', 0, 100), rcx = readNum('#c_rcx', 0, 100), rir = readNum('#c_rir', 0, 100), cmin = readNum('#c_cmin', 0, 10000000), alvo = readNum('#c_alvo', 0, 10000000), lucro = readNum('#c_lucro', 0, 100000000);
    if ([das, lim, pct, pres, rcx, rir, cmin, alvo, lucro].some(v => v === null)) { toast('Confira os números: algum campo está inválido.'); return; }
    Object.assign(c, { nome: nome || 'Meu MEI', das, limite: lim, pctIsento: pct, presuncao: pres, reservaCaixa: rcx, reservaIR: rir, caixaMin: cmin, retiradaAlvo: alvo, lucroInicial: lucro, abertura: $('#c_abertura').value, descontaDas: $('#c_das_abate').checked });
    try { await Store.saveCfg(); toast('Ajustes salvos'); } catch (x) { toast('Não foi possível salvar agora.'); } render();
  }
  else if (a === 'gconnect') { GS.busy = true; GS.err = ''; render(); try { await Store.gConnect(true); } catch (x) { GS.err = /popup|closed|access_denied|cancel/i.test(x.message) ? 'Login cancelado ou permissão negada. Tente de novo.' : 'Não foi possível conectar: ' + x.message; } GS.busy = false; render(); }
  else if (a === 'grefresh') { await Store.gRefresh(); render(); toast('Dados atualizados da planilha'); }
  else if (a === 'gdisc') { Store.gDisconnect(); render(); }
  else if (a === 'conferir') {
    const dt = $('#cf_data').value, out = $('#cfRes');
    const msg = m => { out.innerHTML = `<p class="small neg" style="margin-top:8px">${m}</p>`; };
    if (!/^\d{4}-\d{2}-\d{2}$/.test(dt)) return msg('Informe a data do extrato.');
    const b = balances(S.tx.filter(t => t.data <= dt), S.cfg);
    let html = '', n = 0;
    for (const c of S.cfg.contas.filter(x => x.ativa)) {
      const el = $('#cfc_' + c.id), txt = el ? el.value.trim() : ''; if (!txt) continue; n++;
      const v = parseNum(txt); if (!isFinite(v)) { html += `<p class="small neg" style="margin-top:8px">O saldo de ${esc(c.nome)} não é um número válido.</p>`; continue; }
      const app = b.por[c.id] || 0, d = r2(v - app), ok = Math.abs(d) < 0.005, inv = c.tipo === 'aplicacao';
      let dica = '';
      if (!ok && !inv) dica = d > 0 ? `<p class="small" style="margin-top:6px">O extrato tem ${brl(d)} a mais. Provável receita ou resgate sem lançar, ou uma saída lançada a mais.</p>` : `<p class="small" style="margin-top:6px">O extrato tem ${brl(-d)} a menos. Provável despesa, tarifa, DAS ou transferência sem lançar, ou uma entrada lançada a mais.</p>`;
      if (!ok && inv) dica = d > 0 ? `<p class="small" style="margin-top:6px">O saldo do banco tem ${brl(d)} a mais que o app. Se você não aplicou nada novo, é o rendimento líquido do período.</p><button class="btn sm" style="margin-top:6px" data-act="novo" data-tipo="rendimento" data-valor="${d}" data-conta="${esc(c.id)}" data-data="${esc(dt)}">Lançar rendimento de ${brl(d)}</button>` : `<p class="small" style="margin-top:6px">O saldo do banco tem ${brl(-d)} a menos que o app. Provável resgate, imposto retido ou aplicação sem lançar.</p>`;
      html += `<div class="card flat" style="margin-top:8px"><div class="step" style="border:0"><b>${esc(c.nome)}</b><span class="pill ${ok ? 'ok' : 'bad'}">${ok ? 'Bateu' : 'Diferença ' + sinal(d)}</span></div><div class="step"><span>No extrato</span><span class="n">${brl(v)}</span></div><div class="step"><span>No app</span><span class="n">${brl(app)}</span></div>${dica}</div>`;
    }
    if (!n) return msg('Digite o saldo de pelo menos uma conta.');
    out.innerHTML = html;
  }
  else if (a === 'relCsv') saveFile(relNomeArq(), relCsv(), 'Relatório');
  else if (a === 'relPrint') { try { window.print(); } catch (x) { toast('Impressão indisponível aqui. Baixe a planilha.'); } }
  else if (a === 'ctSave' || a === 'ctAdd' || a === 'ctArq' || a === 'ctDel') await acaoConta(a, el);
  else if (a.startsWith('cat')) await acaoCat(a, el);
  else if (a === 'rmrbCsv') saveFile('receitas-brutas-' + S.ano + '.csv', rmrbCsv(), 'Relatório');
  else if (a === 'rmrbCopy') { try { await navigator.clipboard.writeText(rmrbCsv().replace(/;/g, '\t')); toast('Texto copiado'); } catch (x) { openSheet(`<h2>Copie o texto</h2><textarea id="cp" rows="12" style="width:100%;font-family:var(--f-mono);font-size:.8rem">${esc(rmrbCsv().replace(/;/g, '\t'))}</textarea><button class="btn alt" data-act="close">Fechar</button>`); const ta = $('#cp'); ta.focus(); ta.select(); } }
  else if (a === 'exportJson') saveFile('caixa-mei-backup.json', JSON.stringify({ versao: 2, cfg: S.cfg, tx: S.tx }, null, 1), 'Backup');
  else if (a === 'exportCsv') saveFile('lancamentos.csv', txCsv(), 'Arquivo');
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'selMes') { S.ym = t.value; render(); }
  else if (t.id === 'selAno') { S.ano = Number(t.value); S.ym = S.ano + S.ym.slice(4); render(); }
  else if (t.dataset && t.dataset.act === 'filtro') { S.filtro = t.value; render(); }
  else if (t.dataset && t.dataset.rel) { S.rel[t.dataset.rel] = t.value; if (t.dataset.rel === 'kind') S.rel.cat = 'todas'; render(); }
  else if (t.id === 'impFile' && t.files[0]) {
    const rd = new FileReader();
    rd.onload = async () => {
      try {
        const d = JSON.parse(rd.result); if (!d || !Array.isArray(d.tx)) throw new Error('formato');
        const ok = d.tx.filter(x => x && TIPOS[x.tipo] && /^\d{4}-\d{2}-\d{2}$/.test(x.data) && Number(x.valor) > 0);
        if (S.example) { S.tx = []; S.example = false; }
        if (d.cfg) S.cfg = mkCfg(d.cfg);
        await Store.saveCfg();
        await Store.saveMany(ok.map(x => ({ ...x, id: x.id || newId() })));
        toast(ok.length + ' lançamentos importados'); render();
      } catch (x) { toast('Arquivo inválido. Use um backup baixado por este app.'); }
    };
    rd.readAsText(t.files[0]); t.value = '';
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheetbg').hidden) closeSheet(); });
document.addEventListener('click', e => { if (e.target.id === 'sheetbg') closeSheet(); });

function render() {
  renderHeader(); renderNav();
  const v = { painel: viewPainel, lanc: viewLanc, apur: viewApur, rel: viewRel, contas: viewContas, obrig: viewObrig, ajustes: viewAjustes }[S.tab];
  const precisaConectar = Store.mode === 'sheets' && !GS.connected;
  $('#view').innerHTML = precisaConectar ? viewConectar() : v();
  $('#fab').hidden = precisaConectar || S.tab === 'ajustes' || S.tab === 'rel';
}
const aoMudar = () => { const ae = document.activeElement; const digitando = ae && ['INPUT', 'SELECT', 'TEXTAREA'].includes(ae.tagName) && ae.closest('#view'); if (S.tab !== 'ajustes' && $('#sheetbg').hidden && !digitando) render(); else renderHeader(); };
if (window.MEI_CONFIG && window.MEI_CONFIG.googleClientId) {
  S.example = false; S.tx = []; Store.mode = 'sheets'; S.storage = 'sheets'; render();
  Store.initSheets(aoMudar);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Store.mode === 'sheets' && GS.connected && Date.now() - GS.last > 30000) Store.gRefresh(); });
} else {
  Store.localLoad();
  if (S.example) S.tx = exampleData(S.ano, Number(hojeISO.slice(5, 7)));
  render();
  Store.init(aoMudar);
}
</script>
